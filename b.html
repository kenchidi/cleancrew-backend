<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1A6DDB" />
  <title>Business — CleanCrew</title>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #1A6DDB;
      --primary-dark: #0F4FA8;
      --ink: #0F172A;
      --slate: #64748B;
      --surface: #F8FAFC;
      --surface-2: #F1F5F9;
      --border: #E2E8F0;
      --success: #16A34A;
      --font: 'Plus Jakarta Sans', system-ui, sans-serif;
      --display: 'Plus Jakarta Sans', system-ui, sans-serif;
      --radius: 20px;
      --shadow-sm: 0 8px 24px rgba(15,23,42,.06);
      --shadow-md: 0 18px 50px rgba(15,23,42,.10);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: var(--font); color: var(--ink); background: #fff; line-height: 1.55; -webkit-font-smoothing: antialiased; }
    img { max-width: 100%; display: block; }
    a { color: inherit; text-decoration: none; }
    button, input, select, textarea { font: inherit; }
    .state { text-align: center; padding: 80px 20px; color: var(--slate); }
    .state.error { color: #B91C1C; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      border: none; border-radius: 12px; padding: 13px 18px;
      font-weight: 800; font-size: 14px; cursor: pointer; transition: .18s ease; min-height: 46px;
    }
    .btn:hover { transform: translateY(-1px); filter: brightness(.98); }
    .btn:active { transform: translateY(0); }
    .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 8px 20px color-mix(in srgb, var(--primary) 24%, transparent); }
    .btn-wa { background: #25D366; color: #fff; }
    .btn-outline { background: #fff; color: var(--ink); border: 1px solid var(--border); }
    .btn-ghost { background: rgba(255,255,255,.14); color: #fff; border: 1px solid rgba(255,255,255,.35); }
    .btn-wide { width: 100%; }

    label { display: block; font-size: 12px; font-weight: 800; color: var(--slate); margin-bottom: 5px; }
    input, select, textarea {
      width: 100%; padding: 13px 14px; border: 1px solid var(--border); border-radius: 12px;
      font-size: 15px; margin-bottom: 12px; background: #fff; color: var(--ink);
    }
    input:focus, select:focus, textarea:focus {
      outline: none; border-color: var(--primary);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--primary) 13%, transparent);
    }
    .ok { background: #ECFDF5; color: #065F46; border-radius: 12px; padding: 12px; font-size: 14px; margin-bottom: 12px; font-weight: 700; }
    .err { background: #FEF2F2; color: #991B1B; border-radius: 12px; padding: 12px; font-size: 14px; margin-bottom: 12px; font-weight: 700; }

    /* —— Shared nav —— */
    .nav {
      position: sticky; top: 0; z-index: 50;
      background: rgba(255,255,255,.90); backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(226,232,240,.82);
    }
    .nav-inner {
      max-width: 1160px; margin: 0 auto; padding: 12px 20px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 15px; min-width: 0; }
    .brand img, .brand .mark { width: 38px; height: 38px; border-radius: 11px; object-fit: cover; flex: 0 0 auto; }
    .brand .mark { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; display: grid; place-items: center; font-size: 16px; }
    .brand-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .nav-links { display: flex; flex-wrap: wrap; gap: 3px; justify-content: flex-end; align-items: center; }
    .nav-links a { font-size: 13px; font-weight: 700; color: var(--slate); padding: 8px 10px; border-radius: 999px; }
    .nav-links a:hover { background: var(--surface); color: var(--ink); }
    .nav-links .nav-cta { background: var(--primary); color: #fff !important; padding: 9px 14px; }

    .wrap { max-width: 1160px; margin: 0 auto; padding: 0 20px; }
    .section { padding: 64px 0; }
    .section-head { margin-bottom: 24px; }
    .section h2 { font-size: clamp(1.45rem, 3vw, 2rem); font-weight: 850; letter-spacing: -.035em; margin-bottom: 7px; }
    .section .sub { color: var(--slate); margin-bottom: 22px; max-width: 58ch; }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 7px; padding: 6px 10px; border-radius: 999px;
      background: color-mix(in srgb, var(--primary) 9%, #fff); color: var(--primary);
      font-size: 11px; font-weight: 850; letter-spacing: .07em; text-transform: uppercase; margin-bottom: 13px;
    }
    .eyebrow::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--primary); }

    .grid-3 { display: grid; gap: 16px; grid-template-columns: 1fr; }
    @media (min-width: 720px) { .grid-3 { grid-template-columns: repeat(3, 1fr); } }
    .svc-card {
      border: 1px solid var(--border); border-radius: var(--radius); padding: 20px;
      background: #fff; box-shadow: var(--shadow-sm); transition: .18s ease;
    }
    .svc-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .svc-icon {
      width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center;
      background: color-mix(in srgb, var(--primary) 10%, #fff); color: var(--primary);
      font-weight: 900; margin-bottom: 16px;
    }
    .svc-card strong { display: block; font-size: 15px; margin-bottom: 5px; }
    .svc-card .price { color: var(--primary); font-weight: 850; font-size: 13px; }
    .svc-card p { font-size: 13px; color: var(--slate); margin-top: 7px; }

    .t-grid { display: grid; gap: 14px; grid-template-columns: 1fr; }
    @media (min-width: 720px) { .t-grid { grid-template-columns: repeat(3, 1fr); } }
    .t-card { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; font-size: 14px; box-shadow: var(--shadow-sm); }
    .t-card q { display: block; font-style: normal; margin-bottom: 12px; color: var(--ink); }
    .t-card span { font-size: 12px; font-weight: 800; color: var(--slate); }

    .about-card {
      display: grid; gap: 24px; padding: 26px; border-radius: 24px;
      background: linear-gradient(135deg, var(--surface), #fff); border: 1px solid var(--border);
    }
    @media (min-width: 760px) { .about-card { grid-template-columns: 1fr .8fr; align-items: center; } }
    .about-copy { color: var(--ink); font-size: 15px; }
    .area-box { padding: 18px; border-radius: 16px; background: #fff; border: 1px solid var(--border); }
    .area-box strong { display:block; font-size: 12px; color: var(--slate); margin-bottom: 5px; text-transform: uppercase; letter-spacing: .06em; }
    .area-box span { font-size: 14px; font-weight: 700; }

    .book-section { background: var(--surface); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
    .book-card {
      display: grid; gap: 24px; background: #fff; border: 1px solid var(--border); border-radius: 24px;
      padding: 24px; box-shadow: var(--shadow-md);
    }
    @media (min-width: 800px) { .book-card { grid-template-columns: .75fr 1.25fr; padding: 32px; } }
    .book-copy h2 { margin-bottom: 8px; }
    .book-copy p { color: var(--slate); max-width: 38ch; }
    .book-side { padding: 4px; }

    .how { background: var(--surface); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
    .steps { display: grid; gap: 14px; }
    @media (min-width: 700px) { .steps { grid-template-columns: repeat(3, 1fr); } }
    .step { background: #fff; border-radius: var(--radius); padding: 20px; border: 1px solid var(--border); }
    .step .n {
      width: 32px; height: 32px; border-radius: 10px; background: var(--primary); color: #fff;
      display: grid; place-items: center; font-weight: 850; font-size: 13px; margin-bottom: 12px;
    }

    .hero-modern {
      position: relative; overflow: hidden; padding: 70px 0 52px;
      background: radial-gradient(circle at 80% 20%, color-mix(in srgb, var(--primary) 14%, transparent), transparent 32%),
                  linear-gradient(180deg, #fff 0%, var(--surface) 100%);
      border-bottom: 1px solid var(--border);
    }
    .hero-modern-grid { display: grid; gap: 32px; align-items: center; }
    @media (min-width: 840px) { .hero-modern-grid { grid-template-columns: 1fr .9fr; } }
    .hero-modern h1 { font-size: clamp(2.2rem, 5vw, 4rem); line-height: 1.03; letter-spacing: -.055em; max-width: 12ch; margin-bottom: 15px; }
    .hero-modern .lead { color: var(--slate); font-size: 1.05rem; max-width: 48ch; margin-bottom: 22px; }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .hero-visual { min-height: 330px; border-radius: 28px; overflow: hidden; background: var(--surface-2); border: 1px solid var(--border); box-shadow: var(--shadow-md); }
    .hero-visual img { width: 100%; height: 330px; object-fit: cover; }
    .hero-placeholder { min-height: 330px; display:flex; flex-direction:column; justify-content:center; padding:30px; background:linear-gradient(145deg, color-mix(in srgb, var(--primary) 12%, #fff), var(--surface)); }
    .hero-placeholder .placeholder-mark { width:58px; height:58px; border-radius:17px; display:grid; place-items:center; background:var(--primary); color:#fff; font-size:22px; font-weight:900; margin-bottom:18px; }
    .hero-placeholder strong { font-size:20px; margin-bottom:6px; }
    .hero-placeholder span { color:var(--slate); font-size:14px; max-width:34ch; }

    .quick-info { margin-top: -20px; position: relative; z-index: 2; }
    .quick-info-inner { display:grid; grid-template-columns:1fr; gap:10px; padding:15px; background:#fff; border:1px solid var(--border); border-radius:18px; box-shadow:var(--shadow-md); }
    @media (min-width:720px) { .quick-info-inner { grid-template-columns:repeat(3,1fr); } }
    .quick-info-item { padding:8px 12px; }
    @media (min-width:720px) { .quick-info-item + .quick-info-item { border-left:1px solid var(--border); } }
    .quick-info-item b { display:block; font-size:12px; color:var(--slate); margin-bottom:3px; }
    .quick-info-item span { font-size:13px; font-weight:750; }

    footer.site-foot { border-top:1px solid var(--border); padding:30px 20px 84px; background:#fff; }
    footer.site-foot .wrap { display:flex; flex-wrap:wrap; gap:16px; justify-content:space-between; align-items:center; font-size:13px; color:var(--slate); }
    footer.site-foot a { color:var(--primary); font-weight:800; }
    .mobile-actions {
      display:none; position:fixed; left:12px; right:12px; bottom:12px; z-index:60; gap:8px; padding:8px;
      background:rgba(255,255,255,.94); backdrop-filter:blur(14px); border:1px solid var(--border);
      border-radius:16px; box-shadow:0 16px 40px rgba(15,23,42,.18);
    }
    .mobile-actions .btn { flex:1; }
    @media (max-width:719px) {
      .mobile-actions { display:flex; }
      .nav-links a:not(.nav-cta) { display:none; }
      .nav-inner { padding-left:14px; padding-right:14px; }
      .hero-modern { padding-top:46px; }
      .section { padding:50px 0; }
    }

    /* ========== MODERN: split hero + airy ========== */
    body.tpl-modern .hero {
      display: grid; gap: 28px; align-items: center;
      padding: 48px 0 40px;
    }
    @media (min-width: 800px) {
      body.tpl-modern .hero { grid-template-columns: 1.1fr 0.9fr; padding: 56px 0; }
    }
    body.tpl-modern .hero h1 {
      font-size: clamp(1.9rem, 4vw, 2.8rem); line-height: 1.1; letter-spacing: -0.03em; margin-bottom: 12px;
    }
    body.tpl-modern .hero .lead { color: var(--slate); font-size: 1.05rem; margin-bottom: 20px; max-width: 36ch; }
    body.tpl-modern .hero-actions { display: flex; flex-wrap: wrap; gap: 10px; }
    body.tpl-modern .hero-visual {
      border-radius: 24px; overflow: hidden; min-height: 240px;
      background: linear-gradient(145deg, color-mix(in srgb, var(--primary) 20%, #fff), var(--surface));
      border: 1px solid var(--border);
    }
    body.tpl-modern .hero-visual img { width: 100%; height: 280px; object-fit: cover; }
    body.tpl-modern .hero-visual .placeholder {
      height: 280px; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--slate);
    }
    body.tpl-modern .how { background: var(--surface); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
    body.tpl-modern .steps { display: grid; gap: 12px; }
    @media (min-width: 700px) { body.tpl-modern .steps { grid-template-columns: repeat(3, 1fr); } }
    body.tpl-modern .step {
      background: #fff; border-radius: 16px; padding: 18px; border: 1px solid var(--border);
    }
    body.tpl-modern .step .n {
      width: 28px; height: 28px; border-radius: 8px; background: var(--primary); color: #fff;
      display: grid; place-items: center; font-weight: 800; font-size: 13px; margin-bottom: 10px;
    }

    /* ========== VIBRANT: full-bleed hero + bold ========== */
    body.tpl-vibrant {
      --primary: #7C3AED;
      --primary-dark: #5B21B6;
      --surface: #FAF5FF;
      --font: 'DM Sans', system-ui, sans-serif;
    }
    body.tpl-vibrant .nav { background: rgba(250,245,255,0.94); }
    body.tpl-vibrant .hero-bleed {
      position: relative; color: #fff;
      min-height: 420px;
      display: flex; align-items: flex-end;
      background: linear-gradient(135deg, #5B21B6 0%, #7C3AED 45%, #A78BFA 100%);
    }
    body.tpl-vibrant .hero-bleed.has-img {
      background-size: cover; background-position: center;
    }
    body.tpl-vibrant .hero-bleed::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(15,23,42,0.75) 0%, rgba(15,23,42,0.25) 55%, rgba(91,33,182,0.35) 100%);
    }
    body.tpl-vibrant .hero-bleed .wrap { position: relative; z-index: 1; padding-top: 80px; padding-bottom: 40px; }
    body.tpl-vibrant .hero-bleed h1 {
      font-size: clamp(2rem, 5vw, 3.2rem); line-height: 1.05; margin-bottom: 12px; max-width: 16ch;
    }
    body.tpl-vibrant .hero-bleed .lead { opacity: 0.92; margin-bottom: 20px; max-width: 40ch; font-size: 1.08rem; }
    body.tpl-vibrant .hero-actions { display: flex; flex-wrap: wrap; gap: 10px; }
    body.tpl-vibrant .svc-card {
      background: #fff; border-color: #DDD6FE;
      box-shadow: 0 8px 24px rgba(124,58,237,0.08);
    }
    body.tpl-vibrant .band {
      background: linear-gradient(90deg, #5B21B6, #7C3AED);
      color: #fff; padding: 28px 18px; text-align: center;
    }
    body.tpl-vibrant .band p { font-weight: 700; font-size: 1.15rem; margin-bottom: 12px; }

    /* ========== ELEGANT: centered editorial ========== */
    body.tpl-elegant {
      --primary: #0F766E;
      --primary-dark: #115E59;
      --surface: #F0FDFA;
      --display: 'Playfair Display', Georgia, serif;
    }
    body.tpl-elegant .nav { border-bottom-color: #CCFBF1; }
    body.tpl-elegant .hero-center {
      text-align: center; padding: 56px 0 40px;
      border-bottom: 1px solid #CCFBF1;
      background: linear-gradient(180deg, #F0FDFA 0%, #fff 100%);
    }
    body.tpl-elegant .hero-center .eyebrow {
      font-size: 12px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--primary); margin-bottom: 12px;
    }
    body.tpl-elegant .hero-center h1 {
      font-family: var(--display); font-size: clamp(2rem, 4.5vw, 3rem);
      font-weight: 700; line-height: 1.15; margin-bottom: 14px; max-width: 18ch; margin-left: auto; margin-right: auto;
    }
    body.tpl-elegant .hero-center .lead {
      color: var(--slate); max-width: 42ch; margin: 0 auto 22px; font-size: 1.05rem;
    }
    body.tpl-elegant .hero-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    body.tpl-elegant .hero-photo {
      max-width: 720px; margin: 28px auto 0; border-radius: 4px; overflow: hidden;
      border: 1px solid #CCFBF1; min-height: 200px;
      background: var(--surface);
    }
    body.tpl-elegant .hero-photo img { width: 100%; height: 300px; object-fit: cover; }
    body.tpl-elegant .svc-card { border-radius: 4px; background: #fff; border-color: #CCFBF1; }
    body.tpl-elegant .svc-list { display: grid; gap: 0; border: 1px solid #CCFBF1; border-radius: 4px; overflow: hidden; }
    body.tpl-elegant .svc-list .row {
      display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
      padding: 16px 18px; border-bottom: 1px solid #CCFBF1; background: #fff;
    }
    body.tpl-elegant .svc-list .row:last-child { border-bottom: 0; }
    body.tpl-elegant .divider-line {
      width: 48px; height: 2px; background: var(--primary); margin: 0 auto 16px;
    }
  </style>
</head>
<body class="tpl-modern">
  <div id="app" class="state">Loading…</div>
  <script>
    (function () {
      var API = 'https://cleancrew-backend.onrender.com/api';
      var params = new URLSearchParams(window.location.search);
      var pathParts = window.location.pathname.split('/').filter(Boolean);
      var slug = params.get('s') || params.get('slug') || '';
      if (!slug && pathParts.length >= 2 && pathParts[0] === 'b') slug = pathParts[1];
      var app = document.getElementById('app');
      if (!slug) {
        app.className = 'state error';
        app.textContent = 'Missing link. Use cleancrewapp.com/b.html?s=your-business';
        return;
      }

      function esc(s) {
        return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      }
      function waLink(num) {
        var d = String(num || '').replace(/\D/g, '');
        if (!d) return null;
        if (d.length === 11 && d[0] === '0') d = '234' + d.slice(1);
        if (d.length === 10) d = '234' + d;
        return 'https://wa.me/' + d + '?text=' + encodeURIComponent('Hi, I found your page and I would like to book a service.');
      }
      function money(n) {
        if (n == null || n === '' || isNaN(Number(n))) return '';
        return '₦' + Number(n).toLocaleString('en-NG');
      }
      function servicesList(b) {
        var list = [];
        try {
          if (b.services_json) list = typeof b.services_json === 'string' ? JSON.parse(b.services_json) : b.services_json;
        } catch (e) { list = []; }
        if (!list || !list.length) {
          list = String(b.services || '').split(/\n+/).map(function (l) {
            var p = l.split('|').map(function (x) { return x.trim(); });
            if (!p[0]) return null;
            var item = { name: p[0] };
            if (p[1] && !isNaN(Number(p[1]))) item.price_min = Number(p[1]);
            if (p[2] && !isNaN(Number(p[2]))) item.price_max = Number(p[2]);
            return item;
          }).filter(Boolean);
        }
        return list || [];
      }
      function parseTestimonials(text) {
        return String(text || '').split(/\n+/).map(function (l) {
          l = l.trim();
          if (!l) return null;
          var parts = l.split('—');
          if (parts.length < 2) parts = l.split(' - ');
          if (parts.length >= 2) {
            return { quote: parts[0].trim().replace(/^["“]|["”]$/g, ''), name: parts.slice(1).join('—').trim() };
          }
          return { quote: l.replace(/^["“]|["”]$/g, ''), name: 'Customer' };
        }).filter(Boolean).slice(0, 6);
      }

      fetch(API + '/public/business/' + encodeURIComponent(slug))
        .then(function (r) {
          return r.json().then(function (body) {
            if (!r.ok) throw new Error((body && body.error) || 'Page not found');
            return body;
          });
        })
        .then(function (b) {
          document.title = (b.business_name || 'Business') + ' — Cleaning & Laundry';
          var tpl = (b.template_id || 'modern').toLowerCase();
          if (['modern', 'vibrant', 'elegant'].indexOf(tpl) < 0) tpl = 'modern';
          document.body.className = 'tpl-' + tpl;
          if (b.primary_color) {
            document.documentElement.style.setProperty('--primary', b.primary_color);
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', b.primary_color);
          }

          var wa = waLink(b.whatsapp || b.phone);
          var initial = (b.business_name || 'B').charAt(0).toUpperCase();
          var brandMark = b.logo_url
            ? '<img src="' + esc(b.logo_url) + '" alt="" />'
            : '<span class="mark">' + esc(initial) + '</span>';
          var svcs = servicesList(b);
          var testimonials = parseTestimonials(b.testimonials);
          var heroImg = b.hero_image_url || '';

          function svcCards() {
            if (!svcs.length) {
              return '<div class="svc-card"><div class="svc-icon">✓</div><strong>Services available</strong><p>Contact this business to confirm available services and pricing.</p></div>';
            }
            return svcs.map(function (s) {
              var price = '';
              if (s.price_min != null && s.price_max != null) price = money(s.price_min) + ' – ' + money(s.price_max);
              else if (s.price_min != null) price = 'From ' + money(s.price_min);
              return '<div class="svc-card"><div class="svc-icon">✓</div><strong>' + esc(s.name || s.title) + '</strong>' +
                (price ? '<div class="price">' + esc(price) + '</div>' : '') +
                (s.description ? '<p>' + esc(s.description) + '</p>' : '') + '</div>';
            }).join('');
          }
          function svcRowsElegant() {
            var list = svcs;
            return '<div class="svc-list">' + list.map(function (s) {
              var price = '';
              if (s.price_min != null && s.price_max != null) price = money(s.price_min) + ' – ' + money(s.price_max);
              else if (s.price_min != null) price = 'From ' + money(s.price_min);
              return '<div class="row"><strong>' + esc(s.name || s.title) + '</strong><span class="price" style="color:var(--primary);font-weight:800;">' + esc(price || 'Ask') + '</span></div>';
            }).join('') + '</div>';
          }
          function opts() {
            var o = svcs.map(function (s) {
              return '<option value="' + esc(s.name || s.title) + '">' + esc(s.name || s.title) + '</option>';
            }).join('');
            return o || '<option value="Home cleaning">Home cleaning</option><option value="Laundry">Laundry</option>';
          }
          function testimonialsHtml() {
            if (!testimonials.length) return '';
            return '<section class="section" id="reviews"><div class="wrap">' +
              '<h2>What clients say</h2><p class="sub">Real feedback from people we serve.</p>' +
              '<div class="t-grid">' + testimonials.map(function (t) {
                return '<div class="t-card"><q>“' + esc(t.quote) + '”</q><span>— ' + esc(t.name) + '</span></div>';
              }).join('') + '</div></div></section>';
          }
          function bookBlock() {
            if (b.booking_enabled === false) return '';
            return '<section class="section book-section" id="book"><div class="wrap"><div class="book-card">' +
              '<div class="book-copy"><div class="eyebrow">Book a service</div><h2>Tell us what you need.</h2>' +
              '<p>Send a quick request and this business can confirm availability, timing and final pricing with you.</p>' +
              (wa ? '<div style="margin-top:18px;"><a class="btn btn-wa" href="' + wa + '" target="_blank" rel="noopener">Chat on WhatsApp</a></div>' : '') +
              '</div><div class="book-side"><div id="bookMsg"></div><form id="bookForm">' +
              '<label>Your name *</label><input name="client_name" required autocomplete="name" />' +
              '<label>Phone / WhatsApp *</label><input name="client_phone" type="tel" required />' +
              '<label>Service *</label><select name="service_type" required>' + opts() + '</select>' +
              '<label>Preferred date</label><input name="booking_date" type="date" />' +
              '<label>Address</label><input name="client_address" />' +
              '<label>Notes</label><textarea name="notes" rows="3" placeholder="Anything the business should know?"></textarea>' +
              '<button type="submit" class="btn btn-primary btn-wide">Request booking</button>' +
              '</form></div></div></div></section>';
          }

          function nav() {
            return '<header class="nav"><div class="nav-inner">' +
              '<a class="brand" href="#top">' + brandMark + '<span class="brand-name">' + esc(b.business_name) + '</span></a>' +
              '<nav class="nav-links">' +
              '<a href="#services">Services</a><a href="#about">About</a>' +
              (testimonials.length ? '<a href="#reviews">Reviews</a>' : '') +
              (b.booking_enabled !== false ? '<a href="#book">Book</a>' : '') +
              (wa ? '<a href="' + wa + '" target="_blank" rel="noopener">WhatsApp</a>' : '') +
              '<a class="nav-cta" href="#book">Book now</a></nav></div></header>';
          }
          function about() {
            var aboutText = b.about || '';
            var areas = b.areas || '';
            if (!aboutText && !areas) return '';
            return '<section class="section" id="about"><div class="wrap">' +
              '<div class="section-head"><div class="eyebrow">About the business</div><h2>Built around the service you need.</h2></div>' +
              '<div class="about-card">' +
              '<p class="about-copy">' + esc(aboutText || (b.business_name + ' is available for service requests. Contact the business to learn more.')).replace(/\n/g, '<br/>') + '</p>' +
              (areas ? '<div class="area-box"><strong>Service area</strong><span>' + esc(areas) + '</span></div>' :
                       '<div class="area-box"><strong>Need help?</strong><span>Use the booking form or WhatsApp to get in touch.</span></div>') +
              '</div></div></section>';
          }

          function quickInfo() {
            var items = [];
            if (b.areas) items.push('<div class="quick-info-item"><b>Service area</b><span>' + esc(b.areas) + '</span></div>');
            if (wa) items.push('<div class="quick-info-item"><b>Fast contact</b><span>WhatsApp available</span></div>');
            items.push('<div class="quick-info-item"><b>Booking</b><span>' + (b.booking_enabled === false ? 'Contact directly' : 'Online requests available') + '</span></div>');
            return '<div class="quick-info"><div class="wrap"><div class="quick-info-inner">' + items.slice(0,3).join('') + '</div></div></div>';
          }

          function mobileActions() {
            return '<div class="mobile-actions">' +
              (b.booking_enabled !== false ? '<a class="btn btn-primary" href="#book">Book now</a>' : '') +
              (wa ? '<a class="btn btn-wa" href="' + wa + '" target="_blank" rel="noopener">WhatsApp</a>' : '') +
              '</div>';
          }

          function foot() {
            return '<footer class="site-foot"><div class="wrap">' +
              '<div><strong style="color:var(--ink)">' + esc(b.business_name) + '</strong><br/>Cleaning & laundry</div>' +
              '<div>Powered by <a href="https://cleancrewapp.com">CleanCrew</a> · <a href="login.html">Business login</a></div>' +
              '</div></footer>';
          }

          var heroActions =
            (b.booking_enabled !== false ? '<a class="btn btn-primary" href="#book">Book a service</a>' : '') +
            (wa ? '<a class="btn btn-wa" href="' + wa + '" target="_blank" rel="noopener">WhatsApp</a>' : '');

          var main = '';

          if (tpl === 'vibrant') {
            var bgStyle = heroImg ? ' style="background-image:url(\'' + esc(heroImg) + '\')"' : '';
            main = nav() +
              '<section class="hero-bleed' + (heroImg ? ' has-img' : '') + '" id="top"' + bgStyle + '>' +
              '<div class="wrap"><h1>' + esc(b.business_name) + '</h1>' +
              '<p class="lead">' + esc(b.tagline || 'Fresh spaces. Happy customers. Book in minutes.') + '</p>' +
              '<div class="hero-actions">' +
              (b.booking_enabled !== false ? '<a class="btn btn-primary" href="#book" style="background:#fff;color:#5B21B6;">Book now</a>' : '') +
              (wa ? '<a class="btn btn-ghost" href="' + wa + '" target="_blank" rel="noopener">WhatsApp</a>' : '') +
              '</div></div></section>' +
              '<section class="section" id="services"><div class="wrap"><h2>Services</h2><p class="sub">Pick what you need — clear and simple.</p><div class="grid-3">' + svcCards() + '</div></div></section>' +
              '<div class="band"><p>Ready for a cleaner space?</p>' +
              (b.booking_enabled !== false ? '<a class="btn" href="#book" style="background:#fff;color:#5B21B6;">Request a booking</a>' : '') +
              '</div>' +
              about() + testimonialsHtml() + bookBlock() + foot();
          } else if (tpl === 'elegant') {
            main = nav() +
              '<section class="hero-center" id="top"><div class="wrap">' +
              '<div class="eyebrow">Cleaning & laundry</div>' +
              '<h1>' + esc(b.business_name) + '</h1>' +
              '<p class="lead">' + esc(b.tagline || 'Thoughtful service. Professional finish. Every visit.') + '</p>' +
              '<div class="hero-actions">' + heroActions + '</div>' +
              '<div class="hero-photo">' +
              (heroImg ? '<img src="' + esc(heroImg) + '" alt="" />' : '<div style="height:200px;display:grid;place-items:center;color:var(--slate);font-size:14px;">Add a hero photo in Settings</div>') +
              '</div></div></section>' +
              '<section class="section" id="services"><div class="wrap"><h2 style="text-align:center;">Services & rates</h2><div class="divider-line"></div>' +
              svcRowsElegant() + '</div></section>' +
              about() + testimonialsHtml() + bookBlock() + foot();
          } else {
            /* modern — shared default business template */
            main = nav() +
              '<section class="hero-modern" id="top"><div class="wrap"><div class="hero-modern-grid">' +
              '<div><div class="eyebrow">Professional service</div><h1>' + esc(b.business_name) + '</h1>' +
              '<p class="lead">' + esc(b.tagline || 'Reliable cleaning and laundry services, made easy to book.') + '</p>' +
              '<div class="hero-actions">' +
              (b.booking_enabled !== false ? '<a class="btn btn-primary" href="#book">Book a service</a>' : '') +
              (wa ? '<a class="btn btn-wa" href="' + wa + '" target="_blank" rel="noopener">WhatsApp</a>' : '') +
              '</div></div>' +
              '<div class="hero-visual">' +
              (heroImg ? '<img src="' + esc(heroImg) + '" alt="' + esc(b.business_name) + '" />' :
                '<div class="hero-placeholder"><div class="placeholder-mark">' + esc(initial) + '</div><strong>' + esc(b.business_name) + '</strong><span>Add a hero photo in CleanCrew Settings to make this section even more visual.</span></div>') +
              '</div></div></div></section>' +
              quickInfo() +
              '<section class="section" id="services"><div class="wrap"><div class="section-head"><div class="eyebrow">What we offer</div><h2>Services</h2><p class="sub">Choose a service below or contact the business if you need something specific.</p></div><div class="grid-3">' + svcCards() + '</div></div></section>' +
              '<section class="section how"><div class="wrap"><div class="section-head"><div class="eyebrow">Simple process</div><h2>How it works</h2><p class="sub">A straightforward way to get your service booked.</p></div>' +
              '<div class="steps">' +
              '<div class="step"><div class="n">1</div><strong>Choose a service</strong><p style="font-size:13px;color:var(--slate);margin-top:6px;">Pick what you need or send a request for something specific.</p></div>' +
              '<div class="step"><div class="n">2</div><strong>Send your request</strong><p style="font-size:13px;color:var(--slate);margin-top:6px;">Share your details, preferred date and any useful notes.</p></div>' +
              '<div class="step"><div class="n">3</div><strong>Get confirmed</strong><p style="font-size:13px;color:var(--slate);margin-top:6px;">The business follows up to confirm the details and next steps.</p></div>' +
              '</div></div></section>' +
              about() + testimonialsHtml() + bookBlock() + foot() + mobileActions();
          }

          app.className = '';
          app.innerHTML = main;

          var form = document.getElementById('bookForm');
          if (form) {
            form.addEventListener('submit', function (e) {
              e.preventDefault();
              var fd = new FormData(form);
              var payload = {
                client_name: fd.get('client_name'),
                client_phone: fd.get('client_phone'),
                service_type: fd.get('service_type'),
                booking_date: fd.get('booking_date') || null,
                client_address: fd.get('client_address') || null,
                notes: fd.get('notes') || null
              };
              var msg = document.getElementById('bookMsg');
              var btn = form.querySelector('button[type="submit"]');
              msg.innerHTML = '';
              btn.disabled = true;
              btn.textContent = 'Sending…';
              fetch(API + '/public/business/' + encodeURIComponent(slug) + '/book', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
              })
                .then(function (r) {
                  return r.json().then(function (body) {
                    if (!r.ok) throw new Error((body && body.error) || 'Booking failed');
                    return body;
                  });
                })
                .then(function () {
                  msg.innerHTML = '<div class="ok">Request sent! We will contact you soon.</div>';
                  form.reset();
                })
                .catch(function (err) {
                  msg.innerHTML = '<div class="err">' + esc(err.message || 'Could not send') + '</div>';
                })
                .finally(function () {
                  btn.disabled = false;
                  btn.textContent = 'Request booking';
                });
            });
          }
        })
        .catch(function (e) {
          app.className = 'state error';
          app.textContent = (e && e.message) || 'Page not found';
        });
    })();
  </script>
</body>
</html>
