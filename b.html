<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1A6DDB" />
  <title>Business — CleanCrew</title>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #1A6DDB;
      --primary-dark: #0F4FA8;
      --accent: #16A34A;
      --ink: #0F172A;
      --slate: #64748B;
      --surface: #F8FAFC;
      --border: #E2E8F0;
      --radius: 16px;
      --font: 'Plus Jakarta Sans', system-ui, sans-serif;
      --font-display: 'Plus Jakarta Sans', system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font);
      color: var(--ink);
      background: #fff;
      line-height: 1.55;
      -webkit-tap-highlight-color: transparent;
    }
    a { color: inherit; }
    img { max-width: 100%; display: block; }

    /* Nav */
    .nav {
      position: sticky; top: 0; z-index: 50;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .nav-inner {
      max-width: 1040px; margin: 0 auto;
      padding: 12px 18px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .brand {
      display: flex; align-items: center; gap: 10px;
      font-weight: 800; font-size: 15px; text-decoration: none;
    }
    .brand img, .brand .mark {
      width: 36px; height: 36px; border-radius: 10px; object-fit: cover;
    }
    .brand .mark {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff; display: grid; place-items: center; font-size: 16px;
    }
    .nav-links { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
    .nav-links a {
      text-decoration: none; font-size: 13px; font-weight: 600; color: var(--slate);
      padding: 8px 10px; border-radius: 999px;
    }
    .nav-links a:hover { color: var(--ink); background: var(--surface); }
    .nav-cta {
      background: var(--primary) !important; color: #fff !important;
      padding: 8px 14px !important;
    }
    .nav-cta:hover { filter: brightness(1.05); }

    /* Hero */
    .hero {
      max-width: 1040px; margin: 0 auto;
      padding: 48px 18px 40px;
      display: grid; gap: 28px; align-items: center;
    }
    @media (min-width: 800px) {
      .hero { grid-template-columns: 1.15fr 0.85fr; padding: 64px 18px 56px; }
    }
    .hero h1 {
      font-family: var(--font-display);
      font-size: clamp(1.85rem, 4vw, 2.75rem);
      line-height: 1.12; letter-spacing: -0.03em; margin-bottom: 12px;
    }
    .hero p.lead { font-size: 1.05rem; color: var(--slate); margin-bottom: 22px; max-width: 36ch; }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      border: none; border-radius: 14px; padding: 14px 20px;
      font-family: inherit; font-weight: 700; font-size: 15px;
      text-decoration: none; cursor: pointer;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-wa { background: #25D366; color: #fff; }
    .btn-outline { background: #fff; color: var(--ink); border: 1.5px solid var(--border); }
    .hero-card {
      background: linear-gradient(160deg, color-mix(in srgb, var(--primary) 12%, #fff), #fff);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 16px 40px rgba(15,23,42,0.06);
    }
    .hero-card h3 { font-size: 14px; margin-bottom: 12px; }
    .hero-card ul { list-style: none; }
    .hero-card li {
      display: flex; gap: 10px; align-items: flex-start;
      font-size: 14px; padding: 8px 0; border-bottom: 1px solid var(--border);
    }
    .hero-card li:last-child { border-bottom: 0; }
    .check {
      width: 22px; height: 22px; border-radius: 50%;
      background: color-mix(in srgb, var(--primary) 15%, #fff);
      color: var(--primary); display: grid; place-items: center;
      font-size: 12px; font-weight: 800; flex-shrink: 0;
    }

    /* Sections */
    .section { max-width: 1040px; margin: 0 auto; padding: 40px 18px; }
    .section h2 {
      font-size: 1.45rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 8px;
    }
    .section .sub { color: var(--slate); margin-bottom: 22px; max-width: 48ch; }
    .grid-3 {
      display: grid; gap: 14px;
      grid-template-columns: 1fr;
    }
    @media (min-width: 700px) { .grid-3 { grid-template-columns: repeat(3, 1fr); } }
    .svc-card {
      border: 1px solid var(--border); border-radius: var(--radius);
      padding: 18px; background: var(--surface);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .svc-card:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(15,23,42,0.06); }
    .svc-card strong { display: block; font-size: 15px; margin-bottom: 6px; }
    .svc-card .price { color: var(--primary); font-weight: 800; font-size: 14px; }
    .svc-card p { font-size: 13px; color: var(--slate); margin-top: 6px; }

    .about-box {
      display: grid; gap: 18px;
    }
    @media (min-width: 700px) { .about-box { grid-template-columns: 1fr 1fr; align-items: start; } }
    .about-box .panel {
      border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; background: #fff;
    }

    /* Book form */
    .book-wrap {
      background: var(--surface);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }
    .book-grid {
      display: grid; gap: 20px;
    }
    @media (min-width: 800px) { .book-grid { grid-template-columns: 0.9fr 1.1fr; } }
    label { display: block; font-size: 12px; font-weight: 700; color: var(--slate); margin-bottom: 4px; }
    input, select, textarea {
      width: 100%; padding: 12px 12px; border: 1.5px solid var(--border); border-radius: 12px;
      font-family: inherit; font-size: 16px; margin-bottom: 10px; background: #fff;
    }
    input:focus, select:focus, textarea:focus {
      outline: none; border-color: var(--primary);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 18%, transparent);
    }
    .ok { background: #ECFDF5; color: #065F46; border-radius: 12px; padding: 12px; font-size: 14px; margin-bottom: 12px; font-weight: 600; }
    .err { background: #FEF2F2; color: #991B1B; border-radius: 12px; padding: 12px; font-size: 14px; margin-bottom: 12px; }

    footer {
      max-width: 1040px; margin: 0 auto;
      padding: 28px 18px 40px;
      display: flex; flex-wrap: wrap; gap: 12px;
      justify-content: space-between; align-items: center;
      font-size: 13px; color: var(--slate);
    }
    footer a { color: var(--primary); font-weight: 700; text-decoration: none; }

    .state { text-align: center; padding: 80px 20px; color: var(--slate); }
    .state.error { color: #B91C1C; }

    /* Template: vibrant */
    body.tpl-vibrant {
      --primary: #7C3AED;
      --primary-dark: #5B21B6;
      --accent: #F59E0B;
      --surface: #FAF5FF;
    }
    body.tpl-vibrant .hero {
      background: linear-gradient(135deg, #EDE9FE 0%, #fff 55%);
      max-width: none; padding-left: max(18px, calc((100% - 1040px) / 2 + 18px));
      padding-right: max(18px, calc((100% - 1040px) / 2 + 18px));
    }
    body.tpl-vibrant .svc-card { background: #fff; border-color: #DDD6FE; }

    /* Template: elegant */
    body.tpl-elegant {
      --primary: #0F766E;
      --primary-dark: #115E59;
      --font-display: 'Playfair Display', Georgia, serif;
      --surface: #F0FDFA;
    }
    body.tpl-elegant .hero h1 { font-weight: 700; }
    body.tpl-elegant .nav { border-bottom-color: #CCFBF1; }
    body.tpl-elegant .svc-card { background: #fff; border-radius: 4px; }

    /* Template: modern (default) */
    body.tpl-modern .hero {
      background: linear-gradient(180deg, color-mix(in srgb, var(--primary) 8%, #fff) 0%, #fff 100%);
      max-width: none;
      padding-left: max(18px, calc((100% - 1040px) / 2 + 18px));
      padding-right: max(18px, calc((100% - 1040px) / 2 + 18px));
    }
  </style>
</head>
<body class="tpl-modern">
  <div id="app" class="state">Loading…</div>
  <script>
    (function () {
      var API = 'https://cleancrew-backend.onrender.com/api';
      var params = new URLSearchParams(window.location.search);
      var pathParts = window.location.pathname.split('/').filter(Boolean);
      var slug = params.get('s') || params.get('slug') || '';
      if (!slug && pathParts.length >= 2 && pathParts[0] === 'b') slug = pathParts[1];

      var app = document.getElementById('app');
      if (!slug) {
        app.className = 'state error';
        app.textContent = 'Missing business link. Use cleancrewapp.com/b.html?s=your-name';
        return;
      }

      function esc(s) {
        return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      }
      function waLink(num) {
        var d = String(num || '').replace(/\D/g, '');
        if (!d) return null;
        if (d.length === 11 && d[0] === '0') d = '234' + d.slice(1);
        if (d.length === 10) d = '234' + d;
        return 'https://wa.me/' + d + '?text=' + encodeURIComponent('Hi, I found you online and I would like to book a service.');
      }
      function money(n) {
        if (n == null || n === '' || isNaN(Number(n))) return '';
        return '₦' + Number(n).toLocaleString('en-NG');
      }
      function servicesList(b) {
        var list = [];
        if (b.services_json && (b.services_json.length || typeof b.services_json === 'string')) {
          try {
            list = typeof b.services_json === 'string' ? JSON.parse(b.services_json) : b.services_json;
          } catch (e) { list = []; }
        }
        if (!list.length && b.services) {
          list = String(b.services).split(/\n+/).map(function (l) {
            var parts = l.split('|').map(function (p) { return p.trim(); });
            var item = { name: parts[0] };
            if (parts[1] && !isNaN(Number(parts[1]))) item.price_min = Number(parts[1]);
            if (parts[2] && !isNaN(Number(parts[2]))) item.price_max = Number(parts[2]);
            return item;
          }).filter(function (x) { return x.name; });
        }
        return list || [];
      }

      fetch(API + '/public/business/' + encodeURIComponent(slug))
        .then(function (r) {
          return r.json().then(function (body) {
            if (!r.ok) throw new Error((body && body.error) || 'Not found');
            return body;
          });
        })
        .then(function (b) {
          document.title = (b.business_name || 'Business') + ' — Cleaning & Laundry';
          var tpl = (b.template_id || 'modern').toLowerCase();
          if (['modern', 'vibrant', 'elegant'].indexOf(tpl) === -1) tpl = 'modern';
          document.body.className = 'tpl-' + tpl;

          if (b.primary_color) {
            document.documentElement.style.setProperty('--primary', b.primary_color);
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', b.primary_color);
          }

          var wa = waLink(b.whatsapp || b.phone);
          var initial = (b.business_name || 'B').charAt(0).toUpperCase();
          var brandMark = b.logo_url
            ? '<img src="' + esc(b.logo_url) + '" alt="" />'
            : '<span class="mark" aria-hidden="true">' + esc(initial) + '</span>';

          var svcs = servicesList(b);
          var svcHtml = svcs.map(function (s) {
            var price = '';
            if (s.price_min != null && s.price_max != null) price = money(s.price_min) + ' – ' + money(s.price_max);
            else if (s.price_min != null) price = 'From ' + money(s.price_min);
            return '<div class="svc-card"><strong>' + esc(s.name || s.title) + '</strong>' +
              (price ? '<div class="price">' + esc(price) + '</div>' : '') +
              (s.description ? '<p>' + esc(s.description) + '</p>' : '') +
              '</div>';
          }).join('');
          if (!svcHtml) {
            svcHtml = '<div class="svc-card"><strong>Home cleaning</strong><p>Reliable residential cleaning</p></div>' +
              '<div class="svc-card"><strong>Office cleaning</strong><p>Keep your workspace fresh</p></div>' +
              '<div class="svc-card"><strong>Laundry</strong><p>Wash, fold & care</p></div>';
          }

          var opts = svcs.map(function (s) {
            return '<option value="' + esc(s.name || s.title) + '">' + esc(s.name || s.title) + '</option>';
          }).join('');
          if (!opts) {
            opts = '<option value="Home cleaning">Home cleaning</option><option value="Office cleaning">Office cleaning</option><option value="Laundry">Laundry</option>';
          }

          var highlights = (svcs.slice(0, 4).map(function (s) {
            return '<li><span class="check">✓</span><span>' + esc(s.name || s.title) + '</span></li>';
          }).join('')) || '<li><span class="check">✓</span><span>Professional cleaning</span></li><li><span class="check">✓</span><span>On-time service</span></li><li><span class="check">✓</span><span>Easy WhatsApp booking</span></li>';

          var bookSection = '';
          if (b.booking_enabled !== false) {
            bookSection =
              '<div class="book-wrap" id="book">' +
              '<div class="section">' +
              '<div class="book-grid">' +
              '<div><h2>Book a service</h2><p class="sub">Tell us what you need. The team will confirm on WhatsApp or phone.</p>' +
              (wa ? '<p style="margin-top:12px;"><a class="btn btn-wa" href="' + wa + '" target="_blank" rel="noopener">Or chat on WhatsApp</a></p>' : '') +
              '</div>' +
              '<div>' +
              '<div id="bookMsg"></div>' +
              '<form id="bookForm">' +
              '<label>Your name *</label><input name="client_name" required autocomplete="name" />' +
              '<label>Phone / WhatsApp *</label><input name="client_phone" type="tel" required autocomplete="tel" />' +
              '<label>Service *</label><select name="service_type" required>' + opts + '</select>' +
              '<label>Preferred date</label><input name="booking_date" type="date" />' +
              '<label>Address</label><input name="client_address" placeholder="Area or full address" />' +
              '<label>Notes</label><textarea name="notes" rows="2" placeholder="Rooms, items, access notes…"></textarea>' +
              '<button type="submit" class="btn btn-primary" style="width:100%;">Request booking</button>' +
              '</form></div></div></div></div>';
          }

          app.className = '';
          app.innerHTML =
            '<header class="nav"><div class="nav-inner">' +
            '<a class="brand" href="#top">' + brandMark + '<span>' + esc(b.business_name) + '</span></a>' +
            '<nav class="nav-links" aria-label="Site">' +
            '<a href="#services">Services</a>' +
            '<a href="#about">About</a>' +
            (b.booking_enabled !== false ? '<a href="#book">Book</a>' : '') +
            (wa ? '<a href="' + wa + '" target="_blank" rel="noopener">WhatsApp</a>' : '') +
            '<a class="nav-cta" href="#book">Book now</a>' +
            '</nav></div></header>' +

            '<section class="hero" id="top">' +
            '<div>' +
            '<h1>' + esc(b.business_name) + '</h1>' +
            '<p class="lead">' + esc(b.tagline || 'Professional cleaning & laundry — booked in minutes.') + '</p>' +
            '<div class="hero-actions">' +
            (b.booking_enabled !== false ? '<a class="btn btn-primary" href="#book">Book a service</a>' : '') +
            (wa ? '<a class="btn btn-wa" href="' + wa + '" target="_blank" rel="noopener">WhatsApp us</a>' : '') +
            '<a class="btn btn-outline" href="login.html">Business login</a>' +
            '</div></div>' +
            '<div class="hero-card"><h3>Why customers choose us</h3><ul>' + highlights + '</ul></div>' +
            '</section>' +

            '<section class="section" id="services">' +
            '<h2>Our services</h2>' +
            '<p class="sub">Clear options and pricing so you know what to expect.</p>' +
            '<div class="grid-3">' + svcHtml + '</div>' +
            '</section>' +

            '<section class="section" id="about">' +
            '<h2>About us</h2>' +
            '<div class="about-box">' +
            '<div class="panel"><p style="font-size:15px;">' +
            esc(b.about || (b.business_name + ' provides reliable cleaning and laundry services. Book online and we will follow up to confirm.')).replace(/\n/g, '<br/>') +
            '</p></div>' +
            '<div class="panel">' +
            (b.areas ? '<p style="font-size:14px;margin-bottom:10px;"><strong>Areas:</strong> ' + esc(b.areas) + '</p>' : '') +
            (b.phone || b.whatsapp ? '<p style="font-size:14px;"><strong>Contact:</strong> ' + esc(b.whatsapp || b.phone) + '</p>' : '') +
            '</div></div></section>' +

            bookSection +

            '<footer>' +
            '<div><strong style="color:var(--ink)">' + esc(b.business_name) + '</strong><br/>Professional cleaning & laundry</div>' +
            '<div>Page powered by <a href="https://cleancrewapp.com">CleanCrew</a> · <a href="login.html">Business login</a></div>' +
            '</footer>';

          var form = document.getElementById('bookForm');
          if (form) {
            form.addEventListener('submit', function (e) {
              e.preventDefault();
              var fd = new FormData(form);
              var payload = {
                client_name: fd.get('client_name'),
                client_phone: fd.get('client_phone'),
                service_type: fd.get('service_type'),
                booking_date: fd.get('booking_date') || null,
                client_address: fd.get('client_address') || null,
                notes: fd.get('notes') || null
              };
              var msg = document.getElementById('bookMsg');
              var btn = form.querySelector('button[type="submit"]');
              msg.innerHTML = '';
              btn.disabled = true;
              btn.textContent = 'Sending…';
              fetch(API + '/public/business/' + encodeURIComponent(slug) + '/book', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
              })
                .then(function (r) {
                  return r.json().then(function (body) {
                    if (!r.ok) throw new Error((body && body.error) || 'Booking failed');
                    return body;
                  });
                })
                .then(function () {
                  msg.innerHTML = '<div class="ok">Request sent! We will contact you soon.</div>';
                  form.reset();
                })
                .catch(function (err) {
                  msg.innerHTML = '<div class="err">' + esc(err.message || 'Could not send booking') + '</div>';
                })
                .finally(function () {
                  btn.disabled = false;
                  btn.textContent = 'Request booking';
                });
            });
          }
        })
        .catch(function (e) {
          app.className = 'state error';
          app.textContent = (e && e.message) || 'Business page not found';
        });
    })();
  </script>
</body>
</html>
