<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — CleanCrew</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --blue: #1A6DDB;
            --blue-dark: #1258B8;
            --blue-light: #EBF3FE;
            --ink: #0F1F40;
            --white: #FFFFFF;
            --slate: #6B7FA3;
            --soft: #F4F7FC;
            --border: #DDE6F5;
            --radius: 16px;
            --radius-sm: 10px;
            --green: #16A34A;
            --red: #DC2626;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            background: var(--soft);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-container {
            max-width: 400px;
            width: 100%;
            background: var(--white);
            border-radius: var(--radius);
            padding: 40px 32px;
            border: 1px solid var(--border);
            box-shadow: 0 8px 40px rgba(0,0,0,0.06);
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            color: var(--ink);
            text-align: center;
            margin-bottom: 4px;
        }
        .logo span {
            color: var(--blue);
        }
        .logo .period {
            color: var(--blue);
        }

        .sub {
            text-align: center;
            color: var(--slate);
            font-size: 14px;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--slate);
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 14px;
            transition: all 0.15s;
            outline: none;
        }
        .form-group input:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(26,109,219,0.12);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: var(--blue);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s;
        }
        .btn:hover {
            background: var(--blue-dark);
            transform: translateY(-1px);
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .btn-sm {
            padding: 8px 16px;
            font-size: 13px;
            width: auto;
        }

        .link {
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
            color: var(--slate);
        }
        .link a {
            color: var(--blue);
            text-decoration: none;
            font-weight: 600;
        }
        .link a:hover {
            text-decoration: underline;
        }
        .link .forgot-link {
            display: block;
            margin-top: 6px;
            font-size: 13px;
            color: var(--slate);
            cursor: pointer;
        }
        .link .forgot-link:hover {
            color: var(--blue);
        }

        .error-msg {
            background: #FEE2E2;
            color: #991B1B;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }
        .error-msg.show {
            display: block;
        }

        .success-msg {
            background: #D1FAE5;
            color: #065F46;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }
        .success-msg.show {
            display: block;
        }

        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--ink);
            color: #fff;
            padding: 14px 24px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 600;
            z-index: 999;
            transform: translateY(80px);
            opacity: 0;
            transition: all 0.3s;
            max-width: 400px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
        .toast.success {
            background: var(--green);
        }
        .toast.error {
            background: var(--red);
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="logo">🧹 Clean<span>Crew</span><span class="period">.</span></div>
        <div class="sub">Login to your dashboard</div>

        <div class="error-msg" id="errorMsg"></div>
        <div class="success-msg" id="successMsg"></div>

        <form id="loginForm">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="you@email.com" required />
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter your password" required />
            </div>
            <button type="submit" class="btn" id="loginBtn">Login →</button>
        </form>

        <div class="link">
            <div>Don't have an account? <a href="signup.html">Create one</a></div>
            <div class="forgot-link" onclick="forgotPassword()">🔑 Forgot Password?</div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ─── SERVER URL ──────────────────────────────────────
        const SERVER_URL = 'https://cleancrew-backend.onrender.com';

        function showToast(msg, type = '') {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = 'toast ' + type;
            toast.classList.add('show');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => toast.classList.remove('show'), 4000);
        }

        // ─── ✅ CHECK IF ALREADY LOGGED IN ─────────────────────
        // If user already has a token, redirect to dashboard
        const token = localStorage.getItem('cleancrew_token');
        if (token) {
            window.location.href = 'dashboard.html';
        }

        // ─── Resend Confirmation Email ──────────────────────
        async function resendConfirmationEmail(email) {
            try {
                const response = await fetch(`${SERVER_URL}/api/auth/resend-confirmation`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await response.json();
                if (response.ok) {
                    showToast('📧 Confirmation email resent! Check your inbox.', 'success');
                } else {
                    showToast('⚠️ ' + (data.error || 'Failed to resend email'), 'error');
                }
            } catch (error) {
                showToast('⚠️ Could not connect to server', 'error');
            }
        }

        // ─── LOGIN ──────────────────────────────────────────
        const form = document.getElementById('loginForm');
        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');
        const loginBtn = document.getElementById('loginBtn');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            errorMsg.classList.remove('show');
            successMsg.classList.remove('show');
            loginBtn.disabled = true;
            loginBtn.textContent = 'Logging in...';

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            try {
                const response = await fetch(`${SERVER_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('cleancrew_token', data.token);
                    localStorage.setItem('cleancrew_user', JSON.stringify(data.user));
                    successMsg.textContent = '✅ Login successful! Redirecting...';
                    successMsg.classList.add('show');
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1500);
                } else if (data.requires_confirmation) {
                    errorMsg.innerHTML = `
                        ${data.error}
                        <br><br>
                        <button onclick="resendConfirmationEmail('${email}')" class="btn btn-primary btn-sm">
                            🔄 Resend Confirmation Email
                        </button>
                    `;
                    errorMsg.classList.add('show');
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Login →';
                } else {
                    errorMsg.textContent = data.error || 'Login failed. Please try again.';
                    errorMsg.classList.add('show');
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Login →';
                }
            } catch (error) {
                errorMsg.textContent = '⚠️ Could not connect to server. Please try again.';
                errorMsg.classList.add('show');
                console.error('Fetch error:', error);
                loginBtn.disabled = false;
                loginBtn.textContent = 'Login →';
            }
        });

        // ─── FORGOT PASSWORD ──────────────────────────────────
        async function forgotPassword() {
            const email = document.getElementById('email').value.trim();
            
            if (!email) {
                showToast('⚠️ Please enter your email address first', 'error');
                return;
            }
            
            try {
                const response = await fetch(`${SERVER_URL}/api/auth/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showToast('✅ Password reset email sent! Check your inbox.', 'success');
                } else {
                    showToast('⚠️ ' + (data.error || 'Failed to send reset email'), 'error');
                }
            } catch (error) {
                showToast('⚠️ Could not connect to server', 'error');
            }
        }
    </script>

</body>
</html>
