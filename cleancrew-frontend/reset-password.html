<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password — CleanCrew</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --blue: #1A6DDB;
            --blue-dark: #1258B8;
            --blue-light: #EBF3FE;
            --ink: #0F1F40;
            --white: #FFFFFF;
            --slate: #6B7FA3;
            --soft: #F4F7FC;
            --border: #DDE6F5;
            --radius: 16px;
            --radius-sm: 10px;
            --green: #16A34A;
            --red: #DC2626;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            background: var(--soft);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-container {
            max-width: 400px;
            width: 100%;
            background: var(--white);
            border-radius: var(--radius);
            padding: 40px 32px;
            border: 1px solid var(--border);
            box-shadow: 0 8px 40px rgba(0,0,0,0.06);
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            color: var(--ink);
            text-align: center;
            margin-bottom: 4px;
        }
        .logo span {
            color: var(--blue);
        }
        .logo .period {
            color: var(--blue);
        }

        .sub {
            text-align: center;
            color: var(--slate);
            font-size: 14px;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--slate);
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 14px;
            transition: all 0.15s;
            outline: none;
        }
        .form-group input:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(26,109,219,0.12);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: var(--blue);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s;
        }
        .btn:hover {
            background: var(--blue-dark);
            transform: translateY(-1px);
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .link {
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
            color: var(--slate);
        }
        .link a {
            color: var(--blue);
            text-decoration: none;
            font-weight: 600;
        }
        .link a:hover {
            text-decoration: underline;
        }

        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--ink);
            color: #fff;
            padding: 14px 24px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 600;
            z-index: 999;
            transform: translateY(80px);
            opacity: 0;
            transition: all 0.3s;
            max-width: 400px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
        .toast.success {
            background: var(--green);
        }
        .toast.error {
            background: var(--red);
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="logo">🧹 Clean<span>Crew</span><span class="period">.</span></div>
        <div class="sub" id="statusMessage">Create a new password</div>

        <form id="resetForm">
            <div class="form-group">
                <label>New Password</label>
                <input type="password" id="password" placeholder="Enter your new password" required minlength="6" />
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm your new password" required minlength="6" />
            </div>
            <button type="submit" class="btn" id="resetBtn">Reset Password →</button>
        </form>

        <div class="link">
            <a href="login.html">← Back to Login</a>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ─── Supabase Config ──────────────────────────────────
        const SUPABASE_URL = 'https://felcnoemepxangyptry.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZlbGNxbm9lbWVweGFuZ3lwdHJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5Mzg5NDYsImV4cCI6MjEwMTUxNDk0Nn0.u2Jx-hfcGOacVpjj3o3C2y9YvprUjUxrKxq_IOOPkNg'; // Replace with your anon key

        // ─── Initialize Supabase ──────────────────────────────
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function showToast(msg, type = '') {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = 'toast ' + type;
            toast.classList.add('show');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => toast.classList.remove('show'), 4000);
        }

        // ─── Get token from URL hash ──────────────────────────
        function getTokenFromURL() {
            const hashParams = new URLSearchParams(window.location.hash.substring(1));
            return hashParams.get('access_token');
        }

        // ─── Get type from URL hash ──────────────────────────
        function getTypeFromURL() {
            const hashParams = new URLSearchParams(window.location.hash.substring(1));
            return hashParams.get('type');
        }

        // ─── Reset Password ──────────────────────────────────
        const form = document.getElementById('resetForm');
        const resetBtn = document.getElementById('resetBtn');
        const password = document.getElementById('password');
        const confirmPassword = document.getElementById('confirmPassword');
        const statusMessage = document.getElementById('statusMessage');

        const token = getTokenFromURL();
        const type = getTypeFromURL();

        // ─── Validate token ──────────────────────────────────
        if (!token || type !== 'recovery') {
            statusMessage.textContent = '⚠️ Invalid or expired reset link. Please request a new password reset.';
            statusMessage.style.color = '#DC2626';
            resetBtn.disabled = true;
            document.querySelector('form').style.opacity = '0.5';
        }

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            if (password.value.length < 6) {
                showToast('⚠️ Password must be at least 6 characters', 'error');
                return;
            }

            if (password.value !== confirmPassword.value) {
                showToast('⚠️ Passwords do not match', 'error');
                return;
            }

            resetBtn.disabled = true;
            resetBtn.textContent = 'Resetting...';

            try {
                // ─── Step 1: Set the session using the token ──
                const { data: sessionData, error: sessionError } = await supabase.auth.setSession({
                    access_token: token,
                    refresh_token: ''
                });

                if (sessionError) throw sessionError;

                // ─── Step 2: Update the password ─────────────
                const { error: updateError } = await supabase.auth.updateUser({
                    password: password.value
                });

                if (updateError) throw updateError;

                showToast('✅ Password reset successful! Redirecting...', 'success');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);

            } catch (error) {
                showToast('⚠️ ' + (error.message || 'Failed to reset password'), 'error');
                console.error('Reset error:', error);
            }

            resetBtn.disabled = false;
            resetBtn.textContent = 'Reset Password →';
        });
    </script>

</body>
</html>
