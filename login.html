<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login — CleanCrew</title>
    <meta name="description" content="Login to your CleanCrew dashboard."/>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png"/>
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png"/>
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <style>
        :root {
            --blue: #1A6DDB;
            --blue-dark: #0F4FA8;
            --blue-deep: #0B3B85;
            --blue-light: #EBF3FE;
            --blue-mist: #F5F9FF;
            --blue-gradient: linear-gradient(135deg, #2E7DE8 0%, #0F4FA8 100%);
            --ink: #0B1526;
            --ink-soft: #33405C;
            --slate: #5B6B85;
            --slate-light: #93A0B8;
            --border: #E7EBF3;
            --surface: #F7F9FC;
            --white: #FFFFFF;
            --green: #16A34A;
            --red: #DC2626;
            --radius-lg: 24px;
            --radius-sm: 11px;
            --shadow-md: 0 10px 30px rgba(11,21,38,.07);
            --shadow-lg: 0 24px 64px rgba(11,21,38,.14);
            --shadow-blue: 0 14px 34px rgba(15,79,168,.28);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            background: var(--surface);
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 20px;
            -webkit-font-smoothing: antialiased;
        }
        .icon { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
        .auth-card {
            width: 100%; max-width: 420px; background: var(--white);
            border-radius: var(--radius-lg); padding: 40px 36px;
            box-shadow: var(--shadow-md); border: 1px solid var(--border);
        }
        .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; justify-content: center; margin-bottom: 8px; }
        .logo-mark {
            width: 36px; height: 36px; border-radius: 10px; background: var(--blue-gradient);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 12px rgba(15, 79, 168, .3);
        }
        .logo-mark svg { width: 20px; height: 20px; }
        .logo-word { font-size: 20px; font-weight: 800; color: var(--ink); letter-spacing: -0.4px; }
        .logo-word span { color: var(--blue); }
        .sub { text-align: center; color: var(--slate); font-size: 14px; margin-bottom: 28px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 12.5px; font-weight: 600; color: var(--slate); margin-bottom: 6px; }
        .form-group input {
            width: 100%; padding: 12px 16px; border: 1.5px solid var(--border);
            border-radius: var(--radius-sm); font-family: inherit; font-size: 14px;
            color: var(--ink); background: var(--white); outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }
        .form-group input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(26, 109, 219, 0.12); }
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            padding: 13px 24px; border: none; border-radius: var(--radius-sm);
            font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer;
            transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.15s ease;
            text-decoration: none; width: 100%;
        }
        .btn .icon { width: 16px; height: 16px; }
        .btn-primary { background: var(--blue-gradient); color: #fff; box-shadow: var(--shadow-blue); }
        .btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 18px 40px rgba(15,79,168,.36); }
        .btn-primary:disabled { opacity: 0.7; cursor: not-allowed; }
        .btn-sm { width: auto; padding: 8px 16px; font-size: 13px; }
        .error-msg, .success-msg {
            padding: 11px 14px; border-radius: var(--radius-sm); font-size: 13px;
            margin-bottom: 16px; display: none; line-height: 1.45;
        }
        .error-msg { background: #FEE2E2; color: #991B1B; }
        .success-msg { background: #D1FAE5; color: #065F46; }
        .error-msg.show, .success-msg.show { display: block; }
        .link { text-align: center; margin-top: 22px; font-size: 14px; color: var(--slate); }
        .link a { color: var(--blue); text-decoration: none; font-weight: 700; }
        .link a:hover { text-decoration: underline; }
        .forgot-link {
            display: block; margin-top: 10px; background: none; border: none;
            color: var(--blue); font-family: inherit; font-size: 13px; font-weight: 600;
            cursor: pointer; padding: 0;
        }
        .forgot-link:hover { text-decoration: underline; }
        .toast {
            position: fixed; bottom: 24px; right: 24px; background: var(--ink); color: #fff;
            padding: 14px 22px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600;
            z-index: 999; transform: translateY(80px); opacity: 0; transition: all 0.3s ease;
            max-width: 380px; box-shadow: var(--shadow-lg); display: flex; align-items: center; gap: 10px;
        }
        .toast .icon { width: 16px; height: 16px; stroke: #fff; }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.success { background: var(--green); }
        .toast.error { background: var(--red); }
        @media (max-width: 480px) {
            .auth-card { padding: 32px 22px; }
        }
    </style>
</head>
<body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <defs>
            <symbol id="ic-sparkle" viewBox="0 0 24 24"><path d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8L12 2z"/></symbol>
            <symbol id="ic-check" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></symbol>
            <symbol id="ic-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
        </defs>
    </svg>
    <div class="auth-card">
        <a href="/" class="logo">
            <span class="logo-mark">
                <svg viewBox="0 0 100 100" fill="none">
                    <path d="M80 34 C74 22 62 14 48 14 C28 14 12 30 12 50 C12 70 28 86 48 86 C62 86 74 78 80 66" stroke="white" stroke-width="13" stroke-linecap="round" fill="none"/>
                    <g transform="translate(68,46)"><path d="M0,-9 L1.6,-1.6 L9,0 L1.6,1.6 L0,9 L-1.6,1.6 L-9,0 L-1.6,-1.6 Z" fill="white"/></g>
                </svg>
            </span>
            <span class="logo-word">Clean<span>Crew</span>.</span>
        </a>
        <div class="sub">Login to your dashboard</div>
        <div class="error-msg" id="errorMsg"></div>
        <div class="success-msg" id="successMsg"></div>
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="you@email.com" required autocomplete="email"/>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password"/>
            </div>
            <button type="submit" class="btn btn-primary" id="loginBtn">
                <svg class="icon"><use href="#ic-arrow"/></svg>
                Login
            </button>
        </form>
        <div class="link">
            <div>Don't have an account? <a href="signup.html">Create one</a></div>
            <button class="forgot-link" type="button" onclick="forgotPassword()">Forgot Password?</button>
        </div>
    </div>
    <div class="toast" id="toast">
        <svg class="icon"><use href="#ic-check"/></svg>
        <span id="toastMessage">Success</span>
    </div>
    <script>
        const SERVER_URL = 'https://cleancrew-backend.onrender.com';

        function showToast(msg, type) {
            type = type || '';
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            toastMessage.textContent = msg;
            toast.className = 'toast ' + type;
            toast.classList.add('show');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(function() { toast.classList.remove('show'); }, 4000);
        }

        const token = localStorage.getItem('cleancrew_token');
        if (token) {
            window.location.href = 'dashboard.html';
        }

        async function resendConfirmationEmail(email) {
            try {
                const response = await fetch(SERVER_URL + '/api/auth/resend-confirmation', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });
                const data = await response.json();
                if (response.ok) showToast('Confirmation email resent! Check your inbox.', 'success');
                else showToast(data.error || 'Failed to resend email', 'error');
            } catch (error) {
                showToast('Could not connect to server', 'error');
            }
        }

        (function() {
            try {
                var params = new URLSearchParams(window.location.search);
                var qEmail = params.get('email');
                if (qEmail) {
                    var emailInput = document.getElementById('email');
                    if (emailInput) emailInput.value = qEmail;
                }
                if (params.get('confirmed') === '1') {
                    var successMsg = document.getElementById('successMsg');
                    if (successMsg) {
                        successMsg.textContent = 'Email confirmed! You can log in now.';
                        successMsg.classList.add('show');
                    }
                }
            } catch (e) {}
        })();

        const form = document.getElementById('loginForm');
        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');
        const loginBtn = document.getElementById('loginBtn');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            errorMsg.classList.remove('show');
            successMsg.classList.remove('show');
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<svg class="icon"><use href="#ic-sparkle"/></svg> Logging in...';

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            try {
                const response = await fetch(SERVER_URL + '/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, password: password })
                });
                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('cleancrew_token', data.token);
                    var rt = data.refresh_token;
                    if (rt && typeof rt === 'string' && rt.length > 40) {
                        localStorage.setItem('cleancrew_refresh_token', rt);
                    } else {
                        localStorage.removeItem('cleancrew_refresh_token');
                        console.warn('Login: refresh_token missing or invalid length', rt && rt.length);
                    }
                    localStorage.setItem('cleancrew_user', JSON.stringify(data.user));
                    successMsg.textContent = 'Login successful! Redirecting...';
                    successMsg.classList.add('show');
                    setTimeout(function() {
                        window.location.href = 'dashboard.html';
                    }, 1200);
                } else if (data.requires_confirmation) {
                    errorMsg.innerHTML = '<strong>Confirm your email first</strong><br>' +
                        (data.error || 'We sent a link when you signed up. Open it to activate your account.') +
                        '<br><br>Check inbox and spam for <strong>' + email + '</strong>.' +
                        '<br><br><button type="button" onclick="resendConfirmationEmail(\'' + email + '\')" class="btn btn-primary btn-sm">Resend confirmation email</button>';
                    errorMsg.classList.add('show');
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<svg class="icon"><use href="#ic-arrow"/></svg> Login';
                } else {
                    errorMsg.textContent = data.error || 'Login failed. Please try again.';
                    errorMsg.classList.add('show');
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<svg class="icon"><use href="#ic-arrow"/></svg> Login';
                }
            } catch (error) {
                errorMsg.textContent = 'Could not connect to server. Please try again.';
                errorMsg.classList.add('show');
                console.error('Fetch error:', error);
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<svg class="icon"><use href="#ic-arrow"/></svg> Login';
            }
        });

        async function forgotPassword() {
            const email = document.getElementById('email').value.trim();
            if (!email) {
                showToast('Enter your email above, then tap Forgot Password', 'error');
                document.getElementById('email').focus();
                return;
            }
            try {
                const response = await fetch(SERVER_URL + '/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });
                const data = await response.json();
                if (response.ok) {
                    errorMsg.classList.remove('show');
                    successMsg.innerHTML = 'Password reset link sent to <strong>' + email + '</strong>. Check your inbox and spam folder.';
                    successMsg.classList.add('show');
                    showToast('Reset email sent — check your inbox', 'success');
                } else {
                    showToast(data.error || 'Failed to send reset email', 'error');
                }
            } catch (error) {
                showToast('Could not connect to server', 'error');
            }
        }

        (function showSessionMsg() {
            try {
                var params = new URLSearchParams(window.location.search);
                var msg = sessionStorage.getItem('cleancrew_login_msg');
                if (params.get('session') === 'expired' || msg) {
                    sessionStorage.removeItem('cleancrew_login_msg');
                    var el = document.getElementById('errorMsg');
                    var text = msg || 'Your session expired. Please log in again.';
                    if (el) {
                        el.textContent = text;
                        el.classList.add('show');
                    }
                }
            } catch (e) {}
        })();
    </script>
</body>
</html>
