<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#FFFFFF" />
    <title>Log in · CleanCrew</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>

        :root {
            --cream: #FFFFFF;
            --ink: #0F172A;
            --ink-soft: #334155;
            --muted: #64748B;
            --line: #E2E8F0;
            --white: #FFFFFF;
            --blue: #1A6DDB;
            --blue-deep: #1557B0;
            --green: #059669;
            --red: #DC2626;
            --shadow: 0 20px 50px rgba(15, 23, 42, 0.08);
            --shadow-sm: 0 8px 24px rgba(15, 23, 42, 0.06);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { height: 100%; }
        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            color: var(--ink);
            background: #FFFFFF;
            min-height: 100%;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
        }
        a { color: var(--blue); text-decoration: none; font-weight: 600; }
        a:hover { text-decoration: underline; }

        .nav-shell {
            padding: 16px 20px 0;
        }
        .nav {
            width: min(480px, 100%);
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 12px 10px 16px;
            background: #FFFFFF;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid #E2E8F0;
            border-radius: 999px;
            box-shadow: 0 4px 16px rgba(15, 23, 42, 0.05);
        }
        .nav-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 1.05rem;
            letter-spacing: -0.03em;
            color: var(--ink);
            text-decoration: none;
        }
        .nav-brand:hover { text-decoration: none; }
        .nav-brand img { width: 28px; height: 28px; object-fit: contain; }
        .nav-brand span span { color: var(--blue); }
        .nav-back {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--ink-soft);
            padding: 8px 14px;
            border-radius: 999px;
            text-decoration: none;
        }
        .nav-back:hover { background: rgba(20,18,15,0.05); text-decoration: none; color: var(--ink); }

        .main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 20px 48px;
        }
        .card {
            width: min(420px, 100%);
            background: #FFFFFF;
            border: 1px solid var(--line);
            border-radius: 24px;
            padding: 36px 28px 28px;
            box-shadow: var(--shadow-sm);
            text-align: center;
        }
        
        .card h1 {
            font-size: 1.55rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            margin-bottom: 6px;
            color: var(--ink);
        }
        .card .sub {
            font-size: 0.95rem;
            color: var(--ink-soft);
            font-weight: 500;
            margin-bottom: 24px;
            line-height: 1.45;
        }
        .form-group {
            margin-bottom: 14px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--ink-soft);
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid var(--line);
            border-radius: 14px;
            font-size: 0.95rem;
            font-family: inherit;
            background: #fff;
            color: var(--ink);
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(26, 109, 219, 0.14);
        }
        .password-hint {
            font-size: 0.75rem;
            color: var(--muted);
            margin-top: 5px;
            font-weight: 500;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px 20px;
            border-radius: 999px;
            font-weight: 700;
            font-size: 0.95rem;
            font-family: inherit;
            border: none;
            cursor: pointer;
            transition: transform 0.15s, filter 0.15s, opacity 0.15s;
            margin-top: 6px;
        }
        .btn:hover:not(:disabled) { transform: translateY(-1px); }
        .btn:disabled { opacity: 0.65; cursor: not-allowed; }
        .btn-primary {
            background: var(--blue);
            color: #fff;
            box-shadow: 0 8px 24px rgba(26, 109, 219, 0.3);
        }
        .btn-primary:hover:not(:disabled) { filter: brightness(1.05); }
        .btn-sm { width: auto; padding: 10px 16px; font-size: 0.88rem; margin-top: 8px; }
        .btn-ghost {
            background: transparent;
            color: var(--ink-soft);
            border: 1px solid var(--line);
            margin-top: 10px;
        }
        .card-foot {
            margin-top: 20px;
            font-size: 0.9rem;
            color: var(--ink-soft);
            font-weight: 500;
        }
        .card-foot a { font-weight: 700; }
        .error-msg, .success-msg {
            display: none;
            padding: 11px 14px;
            border-radius: 12px;
            font-size: 0.88rem;
            font-weight: 600;
            margin-bottom: 14px;
            text-align: left;
            line-height: 1.4;
        }
        .error-msg.show, .success-msg.show { display: block; }
        .error-msg {
            background: #FEF2F2;
            color: #B91C1C;
            border: 1px solid #FECACA;
        }
        .success-msg {
            background: #ECFDF5;
            color: #047857;
            border: 1px solid #A7F3D0;
        }
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--ink);
            color: #fff;
            padding: 12px 18px;
            border-radius: 999px;
            font-size: 0.9rem;
            font-weight: 600;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 999;
            max-width: min(360px, calc(100% - 32px));
            text-align: center;
            box-shadow: var(--shadow);
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .toast.success { background: var(--green); }
        .toast.error { background: var(--red); }
        .icon { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; flex-shrink: 0; }
        .forgot-link {
            display: block;
            text-align: right;
            font-size: 0.82rem;
            margin: -6px 0 12px;
            font-weight: 600;
        }
        .community-note {
            margin-top: 16px;
            padding: 12px 14px;
            background: rgba(26, 109, 219, 0.06);
            border-radius: 14px;
            font-size: 0.82rem;
            color: var(--ink-soft);
            font-weight: 500;
            text-align: left;
            line-height: 1.45;
        }

    </style>
</head>
<body>

    <svg xmlns="http://www.w3.org/2000/svg" style="display:none">
        <symbol id="ic-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
        <symbol id="ic-check" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
        <symbol id="ic-sparkle" viewBox="0 0 24 24"><path d="M12 3l1.5 5.5L19 10l-5.5 1.5L12 17l-1.5-5.5L5 10l5.5-1.5L12 3z" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    </svg>

    <div class="nav-shell">
        <nav class="nav">
            <a href="index.html" class="nav-brand">
                <span>Clean<span>Crew</span></span>
            </a>
            <a class="nav-back" href="index.html">← Home</a>
        </nav>
    </div>

    <div class="main">
        <div class="card">
            <h1>Welcome back</h1>
            <div class="sub" id="statusMessage">Log in to run your cleaning or laundry business.</div>
            <div class="error-msg" id="errorMsg"></div>
            <div class="success-msg" id="successMsg"></div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" placeholder="you@email.com" required autocomplete="email"/>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password"/>
                </div>
                <a class="forgot-link" href="#" id="forgotLink" onclick="forgotPassword(); return false;">Forgot password?</a>
                <button type="submit" class="btn btn-primary" id="loginBtn">
                    <svg class="icon"><use href="#ic-arrow"/></svg>
                    Log in
                </button>
            </form>

            
            <div class="card-foot">New here? <a href="signup.html">Create a free account</a></div>
        </div>
    </div>

    <div class="toast" id="toast">
        <span id="toastMessage">Success</span>
    </div>

<script>
        const SERVER_URL = 'https://cleancrew-backend.onrender.com';

        function showToast(msg, type) {
            type = type || '';
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            toastMessage.textContent = msg;
            toast.className = 'toast ' + type;
            toast.classList.add('show');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(function() { toast.classList.remove('show'); }, 4000);
        }

        const token = localStorage.getItem('cleancrew_token');
        if (token) {
            window.location.href = 'dashboard.html';
        }

        async function resendConfirmationEmail(email) {
            try {
                const response = await fetch(SERVER_URL + '/api/auth/resend-confirmation', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });
                const data = await response.json();
                if (response.ok) showToast('Confirmation email resent! Check your inbox.', 'success');
                else showToast(data.error || 'Failed to resend email', 'error');
            } catch (error) {
                showToast('Could not connect to server', 'error');
            }
        }

        (function() {
            try {
                var params = new URLSearchParams(window.location.search);
                var qEmail = params.get('email');
                if (qEmail) {
                    var emailInput = document.getElementById('email');
                    if (emailInput) emailInput.value = qEmail;
                }
                if (params.get('confirmed') === '1') {
                    var successMsg = document.getElementById('successMsg');
                    if (successMsg) {
                        successMsg.textContent = 'Email confirmed! You can log in now.';
                        successMsg.classList.add('show');
                    }
                }
            } catch (e) {}
        })();

        const form = document.getElementById('loginForm');
        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');
        const loginBtn = document.getElementById('loginBtn');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            errorMsg.classList.remove('show');
            successMsg.classList.remove('show');
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<svg class="icon"><use href="#ic-sparkle"/></svg> Logging in...';

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            try {
                const response = await fetch(SERVER_URL + '/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, password: password })
                });
                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('cleancrew_token', data.token);
                    var rt = data.refresh_token;
                    if (rt && typeof rt === 'string' && rt.length > 40) {
                        localStorage.setItem('cleancrew_refresh_token', rt);
                    } else {
                        localStorage.removeItem('cleancrew_refresh_token');
                        console.warn('Login: refresh_token missing or invalid length', rt && rt.length);
                    }
                    localStorage.setItem('cleancrew_user', JSON.stringify(data.user));
                    successMsg.textContent = 'Login successful! Redirecting...';
                    successMsg.classList.add('show');
                    setTimeout(function() {
                        window.location.href = 'dashboard.html';
                    }, 1200);
                } else if (data.requires_confirmation) {
                    errorMsg.innerHTML = '<strong>Confirm your email first</strong><br>' +
                        (data.error || 'We sent a link when you signed up. Open it to activate your account.') +
                        '<br><br>Check inbox and spam for <strong>' + email + '</strong>.' +
                        '<br><br><button type="button" onclick="resendConfirmationEmail(\'' + email + '\')" class="btn btn-primary btn-sm">Resend confirmation email</button>';
                    errorMsg.classList.add('show');
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<svg class="icon"><use href="#ic-arrow"/></svg> Login';
                } else {
                    errorMsg.textContent = data.error || 'Login failed. Please try again.';
                    errorMsg.classList.add('show');
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<svg class="icon"><use href="#ic-arrow"/></svg> Login';
                }
            } catch (error) {
                errorMsg.textContent = 'Could not connect to server. Please try again.';
                errorMsg.classList.add('show');
                console.error('Fetch error:', error);
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<svg class="icon"><use href="#ic-arrow"/></svg> Login';
            }
        });

        async function forgotPassword() {
            const email = document.getElementById('email').value.trim();
            if (!email) {
                showToast('Enter your email above, then tap Forgot Password', 'error');
                document.getElementById('email').focus();
                return;
            }
            try {
                const response = await fetch(SERVER_URL + '/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });
                const data = await response.json();
                if (response.ok) {
                    errorMsg.classList.remove('show');
                    successMsg.innerHTML = 'Password reset link sent to <strong>' + email + '</strong>. Check your inbox and spam folder.';
                    successMsg.classList.add('show');
                    showToast('Reset email sent — check your inbox', 'success');
                } else {
                    showToast(data.error || 'Failed to send reset email', 'error');
                }
            } catch (error) {
                showToast('Could not connect to server', 'error');
            }
        }

        (function showSessionMsg() {
            try {
                var params = new URLSearchParams(window.location.search);
                var msg = sessionStorage.getItem('cleancrew_login_msg');
                if (params.get('session') === 'expired' || msg) {
                    sessionStorage.removeItem('cleancrew_login_msg');
                    var el = document.getElementById('errorMsg');
                    var text = msg || 'Your session expired. Please log in again.';
                    if (el) {
                        el.textContent = text;
                        el.classList.add('show');
                    }
                }
            } catch (e) {}
        })();
    </script>
