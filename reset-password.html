<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#FFFFFF" />
    <title>Reset password · CleanCrew</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>

        :root {
            --cream: #FFFFFF;
            --ink: #0F172A;
            --ink-soft: #334155;
            --muted: #64748B;
            --line: #E2E8F0;
            --white: #FFFFFF;
            --blue: #1A6DDB;
            --blue-deep: #1557B0;
            --green: #059669;
            --red: #DC2626;
            --shadow: 0 20px 50px rgba(15, 23, 42, 0.08);
            --shadow-sm: 0 8px 24px rgba(15, 23, 42, 0.06);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { height: 100%; }
        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            color: var(--ink);
            background: #FFFFFF;
            min-height: 100%;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
        }
        a { color: var(--blue); text-decoration: none; font-weight: 600; }
        a:hover { text-decoration: underline; }

        .nav-shell {
            padding: 16px 20px 0;
        }
        .nav {
            width: min(480px, 100%);
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 12px 10px 16px;
            background: #FFFFFF;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid #E2E8F0;
            border-radius: 999px;
            box-shadow: 0 4px 16px rgba(15, 23, 42, 0.05);
        }
        .nav-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 1.05rem;
            letter-spacing: -0.03em;
            color: var(--ink);
            text-decoration: none;
        }
        .nav-brand:hover { text-decoration: none; }
        .nav-brand img { width: 28px; height: 28px; object-fit: contain; }
        .nav-brand span span { color: var(--blue); }
        .nav-back {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--ink-soft);
            padding: 8px 14px;
            border-radius: 999px;
            text-decoration: none;
        }
        .nav-back:hover { background: rgba(20,18,15,0.05); text-decoration: none; color: var(--ink); }

        .main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 20px 48px;
        }
        .card {
            width: min(420px, 100%);
            background: #FFFFFF;
            border: 1px solid var(--line);
            border-radius: 24px;
            padding: 36px 28px 28px;
            box-shadow: var(--shadow-sm);
            text-align: center;
        }
        .card-mascot {
            width: 64px;
            height: 64px;
            object-fit: contain;
            margin: 0 auto 14px;
            display: block;
            filter: drop-shadow(0 8px 16px rgba(26, 109, 219, 0.18));
        }
        .card h1 {
            font-size: 1.55rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            margin-bottom: 6px;
            color: var(--ink);
        }
        .card .sub {
            font-size: 0.95rem;
            color: var(--ink-soft);
            font-weight: 500;
            margin-bottom: 24px;
            line-height: 1.45;
        }
        .form-group {
            margin-bottom: 14px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--ink-soft);
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid var(--line);
            border-radius: 14px;
            font-size: 0.95rem;
            font-family: inherit;
            background: #fff;
            color: var(--ink);
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(26, 109, 219, 0.14);
        }
        .password-hint {
            font-size: 0.75rem;
            color: var(--muted);
            margin-top: 5px;
            font-weight: 500;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px 20px;
            border-radius: 999px;
            font-weight: 700;
            font-size: 0.95rem;
            font-family: inherit;
            border: none;
            cursor: pointer;
            transition: transform 0.15s, filter 0.15s, opacity 0.15s;
            margin-top: 6px;
        }
        .btn:hover:not(:disabled) { transform: translateY(-1px); }
        .btn:disabled { opacity: 0.65; cursor: not-allowed; }
        .btn-primary {
            background: var(--blue);
            color: #fff;
            box-shadow: 0 8px 24px rgba(26, 109, 219, 0.3);
        }
        .btn-primary:hover:not(:disabled) { filter: brightness(1.05); }
        .btn-sm { width: auto; padding: 10px 16px; font-size: 0.88rem; margin-top: 8px; }
        .btn-ghost {
            background: transparent;
            color: var(--ink-soft);
            border: 1px solid var(--line);
            margin-top: 10px;
        }
        .card-foot {
            margin-top: 20px;
            font-size: 0.9rem;
            color: var(--ink-soft);
            font-weight: 500;
        }
        .card-foot a { font-weight: 700; }
        .error-msg, .success-msg {
            display: none;
            padding: 11px 14px;
            border-radius: 12px;
            font-size: 0.88rem;
            font-weight: 600;
            margin-bottom: 14px;
            text-align: left;
            line-height: 1.4;
        }
        .error-msg.show, .success-msg.show { display: block; }
        .error-msg {
            background: #FEF2F2;
            color: #B91C1C;
            border: 1px solid #FECACA;
        }
        .success-msg {
            background: #ECFDF5;
            color: #047857;
            border: 1px solid #A7F3D0;
        }
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--ink);
            color: #fff;
            padding: 12px 18px;
            border-radius: 999px;
            font-size: 0.9rem;
            font-weight: 600;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 999;
            max-width: min(360px, calc(100% - 32px));
            text-align: center;
            box-shadow: var(--shadow);
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .toast.success { background: var(--green); }
        .toast.error { background: var(--red); }
        .icon { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; flex-shrink: 0; }
        .forgot-link {
            display: block;
            text-align: right;
            font-size: 0.82rem;
            margin: -6px 0 12px;
            font-weight: 600;
        }
        .community-note {
            margin-top: 16px;
            padding: 12px 14px;
            background: rgba(26, 109, 219, 0.06);
            border-radius: 14px;
            font-size: 0.82rem;
            color: var(--ink-soft);
            font-weight: 500;
            text-align: left;
            line-height: 1.45;
        }

    </style>
</head>
<body>

    <svg xmlns="http://www.w3.org/2000/svg" style="display:none">
        <symbol id="ic-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
        <symbol id="ic-check" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
        <symbol id="ic-sparkle" viewBox="0 0 24 24"><path d="M12 3l1.5 5.5L19 10l-5.5 1.5L12 17l-1.5-5.5L5 10l5.5-1.5L12 3z" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    </svg>

    <div class="nav-shell">
        <nav class="nav">
            <a href="index.html" class="nav-brand">
                <span>Clean<span>Crew</span></span>
            </a>
            <a class="nav-back" href="index.html">← Home</a>
        </nav>
    </div>

    <div class="main">
        <div class="card">
            <img class="card-mascot" src="mascot.png" alt="" width="64" height="64" />
            <h1>New password</h1>
            <div class="sub" id="statusMessage">Create a new password for your account.</div>
            <div class="error-msg" id="errorMsg"></div>
            <div class="success-msg" id="successMsg"></div>
            
            <form id="resetForm">
                <div class="form-group">
                    <label for="password">New password</label>
                    <input type="password" id="password" placeholder="Enter your new password" required minlength="6" autocomplete="new-password" />
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm password</label>
                    <input type="password" id="confirmPassword" placeholder="Confirm your new password" required minlength="6" autocomplete="new-password" />
                </div>
                <button type="submit" class="btn btn-primary" id="resetBtn">
                    <svg class="icon"><use href="#ic-arrow"/></svg> Reset password
                </button>
            </form>

            
            <div class="card-foot"><a href="login.html">Back to log in</a></div>
        </div>
    </div>

    <div class="toast" id="toast">
        <span id="toastMessage">Success</span>
    </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
        const SUPABASE_URL = 'https://felcnoemepxangyptry.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZlbGNxbm9lbWVweGFuZ3lwdHJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5Mzg5NDYsImV4cCI6MjEwMTUxNDk0Nn0.u2Jx-hfcGOacVpjj3o3C2y9YvprUjUxrKxq_IOOPkNg';

        function showToast(msg, type) {
            type = type || '';
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            toastMessage.textContent = msg;
            toast.className = 'toast ' + type;
            toast.classList.add('show');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(function() {
                toast.classList.remove('show');
            }, 4000);
        }

        // Stay on this page even if a session exists — user is completing password recovery

        const { createClient } = supabase;
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const form = document.getElementById('resetForm');
        const resetBtn = document.getElementById('resetBtn');
        const password = document.getElementById('password');
        const confirmPassword = document.getElementById('confirmPassword');
        const statusMessage = document.getElementById('statusMessage');

        // Support hash tokens AND query token_hash (Supabase email links vary)
        const hashParams = new URLSearchParams(window.location.hash.substring(1));
        const queryParams = new URLSearchParams(window.location.search);
        const accessToken = hashParams.get('access_token');
        const refreshToken = hashParams.get('refresh_token') || '';
        const type = hashParams.get('type') || queryParams.get('type');
        const tokenHash = queryParams.get('token_hash') || queryParams.get('token');

        let recoveryReady = false;

        async function prepareRecoverySession() {
            if (accessToken && (type === 'recovery' || !type)) {
                const { error } = await supabaseClient.auth.setSession({
                    access_token: accessToken,
                    refresh_token: refreshToken || accessToken
                });
                if (error) throw error;
                recoveryReady = true;
                return;
            }
            if (tokenHash && (type === 'recovery' || type === 'email')) {
                const { error } = await supabaseClient.auth.verifyOtp({
                    token_hash: tokenHash,
                    type: type === 'email' ? 'email' : 'recovery'
                });
                if (error) throw error;
                recoveryReady = true;
                return;
            }
            throw new Error('Invalid or expired reset link');
        }

        prepareRecoverySession()
            .then(function() {
                statusMessage.textContent = 'Create a new password for your account.';
                statusMessage.style.color = '';
            })
            .catch(function(err) {
                console.error(err);
                statusMessage.innerHTML = 'This reset link is invalid or has expired. <a href="login.html">Request a new one from the login page</a>.';
                statusMessage.style.color = '#DC2626';
                resetBtn.disabled = true;
                form.style.opacity = '0.5';
            });

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            if (password.value.length < 6) {
                showToast('Password must be at least 6 characters', 'error');
                return;
            }

            if (password.value !== confirmPassword.value) {
                showToast('Passwords do not match', 'error');
                return;
            }

            resetBtn.disabled = true;
            resetBtn.innerHTML = '<svg class="icon"><use href="#ic-sparkle"/></svg> Resetting...';

            try {
                if (!recoveryReady) {
                    await prepareRecoverySession();
                }

                const { error: updateError } = await supabaseClient.auth.updateUser({
                    password: password.value
                });

                if (updateError) throw updateError;

                await supabaseClient.auth.signOut();
                localStorage.removeItem('cleancrew_token');
                localStorage.removeItem('cleancrew_user');

                showToast('Password updated! You can log in now.', 'success');
                statusMessage.innerHTML = 'Password updated successfully. Redirecting to login…';
                setTimeout(function() {
                    window.location.href = 'login.html';
                }, 1800);

            } catch (error) {
                showToast(error.message || 'Failed to reset password', 'error');
                console.error('Reset error:', error);
                resetBtn.disabled = false;
                resetBtn.innerHTML = '<svg class="icon"><use href="#ic-arrow"/></svg> Reset Password';
            }
        });
    </script>
<script>
    (function () {
      if (!('serviceWorker' in navigator)) return;
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js').catch(function () {});
      });
    })();
    </script>
</body>
</html>
