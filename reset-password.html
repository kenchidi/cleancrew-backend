            --blue-gradient: linear-gradient(135deg, #2E7DE8 0%, #0F4FA8 100%);
            --ink: #0B1526;
            --ink-soft: #33405C;
            --slate: #5B6B85;
            --slate-light: #93A0B8;
            --border: #E7EBF3;
            --surface: #F7F9FC;
            --white: #FFFFFF;
            --green: #16A34A;
            --red: #DC2626;
            --radius-lg: 24px;
            --radius: 16px;
            --radius-sm: 11px;
            --shadow-sm: 0 1px 2px rgba(11,21,38,.05), 0 1px 1px rgba(11,21,38,.04);
            --shadow-md: 0 10px 30px rgba(11,21,38,.07);
            --shadow-lg: 0 24px 64px rgba(11,21,38,.14);
            --shadow-blue: 0 14px 34px rgba(15,79,168,.28);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            background: var(--surface);
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 20px;
            -webkit-font-smoothing: antialiased;
        }

        .icon {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.7;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }

        .auth-card {
            width: 100%;
            max-width: 420px;
            background: var(--white);
            border-radius: var(--radius-lg);
            padding: 40px 36px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            justify-content: center;
            margin-bottom: 8px;
        }
        .logo-mark {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: var(--blue-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(15, 79, 168, .3);
        }
        .logo-mark svg { width: 20px; height: 20px; }
        .logo-word {
            font-size: 20px;
            font-weight: 800;
            color: var(--ink);
            letter-spacing: -0.4px;
        }
        .logo-word span { color: var(--blue); }

        .sub {
            text-align: center;
            color: var(--slate);
            font-size: 14px;
            margin-bottom: 28px;
        }

        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block;
            font-size: 12.5px;
            font-weight: 600;
            color: var(--slate);
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 14px;
            color: var(--ink);
            background: var(--white);
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }
        .form-group input:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(26, 109, 219, 0.12);
        }
        .form-group input::placeholder { color: var(--slate-light); }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 13px 24px;
            border: none;
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease, opacity 0.15s ease;
            text-decoration: none;
            width: 100%;
        }
        .btn .icon { width: 16px; height: 16px; }
        .btn-primary {
            background: var(--blue-gradient);
            color: #fff;
            box-shadow: var(--shadow-blue);
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 18px 40px rgba(15,79,168,.36);
        }
        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .link {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: var(--slate);
        }
        .link a {
            color: var(--blue);
            text-decoration: none;
            font-weight: 700;
        }
        .link a:hover { text-decoration: underline; }

        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--ink);
            color: #fff;
            padding: 14px 22px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 600;
            z-index: 999;
            transform: translateY(80px);
            opacity: 0;
            transition: all 0.3s ease;
            max-width: 380px;
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .toast .icon { width: 16px; height: 16px; stroke: #fff; }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.success { background: var(--green); }
        .toast.error { background: var(--red); }

        @media (max-width: 480px) {
            .auth-card { padding: 32px 22px; }
            .logo-word { font-size: 18px; }
            .logo-mark { width: 32px; height: 32px; }
            .logo-mark svg { width: 18px; height: 18px; }
        }
    </style>
</head>
<body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <defs>
            <symbol id="ic-sparkle" viewBox="0 0 24 24"><path d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8L12 2z"/></symbol>
            <symbol id="ic-check" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></symbol>
            <symbol id="ic-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16v.01"/></symbol>
            <symbol id="ic-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
        </defs>
    </svg>

    <div class="auth-card">
        <a href="/" class="logo">
            <span class="logo-mark">
                <svg viewBox="0 0 100 100" fill="none">
                    <path d="M80 34 C74 22 62 14 48 14 C28 14 12 30 12 50 C12 70 28 86 48 86 C62 86 74 78 80 66" stroke="white" stroke-width="13" stroke-linecap="round" fill="none"/>
                    <g transform="translate(68,46)"><path d="M0,-9 L1.6,-1.6 L9,0 L1.6,1.6 L0,9 L-1.6,1.6 L-9,0 L-1.6,-1.6 Z" fill="white"/></g>
                </svg>
            </span>
            <span class="logo-word">Clean<span>Crew</span>.</span>
        </a>
        <div class="sub" id="statusMessage">Create a new password</div>

        <form id="resetForm">
            <div class="form-group">
                <label for="password">New Password</label>
                <input type="password" id="password" placeholder="Enter your new password" required minlength="6" autocomplete="new-password" />
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm your new password" required minlength="6" autocomplete="new-password" />
            </div>
            <button type="submit" class="btn btn-primary" id="resetBtn">
                <svg class="icon"><use href="#ic-arrow"/></svg> Reset Password
            </button>
        </form>

        <div class="link">
            <a href="login.html">← Back to Login</a>
        </div>
    </div>

    <div class="toast" id="toast">
        <svg class="icon"><use href="#ic-check"/></svg>
        <span id="toastMessage">Success</span>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://felcnoemepxangyptry.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZlbGNxbm9lbWVweGFuZ3lwdHJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5Mzg5NDYsImV4cCI6MjEwMTUxNDk0Nn0.u2Jx-hfcGOacVpjj3o3C2y9YvprUjUxrKxq_IOOPkNg';

        function showToast(msg, type) {
            type = type || '';
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            toastMessage.textContent = msg;
            toast.className = 'toast ' + type;
            toast.classList.add('show');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(function() {
                toast.classList.remove('show');
            }, 4000);
        }

        // Stay on this page even if a session exists — user is completing password recovery

        const { createClient } = supabase;
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const form = document.getElementById('resetForm');
        const resetBtn = document.getElementById('resetBtn');
        const password = document.getElementById('password');
        const confirmPassword = document.getElementById('confirmPassword');
        const statusMessage = document.getElementById('statusMessage');

        // Support hash tokens AND query token_hash (Supabase email links vary)
        const hashParams = new URLSearchParams(window.location.hash.substring(1));
        const queryParams = new URLSearchParams(window.location.search);
        const accessToken = hashParams.get('access_token');
        const refreshToken = hashParams.get('refresh_token') || '';
        const type = hashParams.get('type') || queryParams.get('type');
        const tokenHash = queryParams.get('token_hash') || queryParams.get('token');

        let recoveryReady = false;

        async function prepareRecoverySession() {
            if (accessToken && (type === 'recovery' || !type)) {
                const { error } = await supabaseClient.auth.setSession({
                    access_token: accessToken,
                    refresh_token: refreshToken || accessToken
                });
                if (error) throw error;
                recoveryReady = true;
                return;
            }
            if (tokenHash && (type === 'recovery' || type === 'email')) {
                const { error } = await supabaseClient.auth.verifyOtp({
                    token_hash: tokenHash,
                    type: type === 'email' ? 'email' : 'recovery'
                });
                if (error) throw error;
                recoveryReady = true;
                return;
            }
            throw new Error('Invalid or expired reset link');
        }

        prepareRecoverySession()
            .then(function() {
                statusMessage.textContent = 'Create a new password for your account.';
                statusMessage.style.color = '';
            })
            .catch(function(err) {
                console.error(err);
                statusMessage.innerHTML = 'This reset link is invalid or has expired. <a href="login.html">Request a new one from the login page</a>.';
                statusMessage.style.color = '#DC2626';
                resetBtn.disabled = true;
                form.style.opacity = '0.5';
            });

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            if (password.value.length < 6) {
                showToast('Password must be at least 6 characters', 'error');
                return;
            }

            if (password.value !== confirmPassword.value) {
                showToast('Passwords do not match', 'error');
                return;
            }

            resetBtn.disabled = true;
            resetBtn.innerHTML = '<svg class="icon"><use href="#ic-sparkle"/></svg> Resetting...';

            try {
                if (!recoveryReady) {
                    await prepareRecoverySession();
                }

                const { error: updateError } = await supabaseClient.auth.updateUser({
                    password: password.value
                });

                if (updateError) throw updateError;

                await supabaseClient.auth.signOut();
                localStorage.removeItem('cleancrew_token');
                localStorage.removeItem('cleancrew_user');

                showToast('Password updated! You can log in now.', 'success');
                statusMessage.innerHTML = 'Password updated successfully. Redirecting to login…';
                setTimeout(function() {
                    window.location.href = 'login.html';
                }, 1800);

            } catch (error) {
                showToast(error.message || 'Failed to reset password', 'error');
                console.error('Reset error:', error);
                resetBtn.disabled = false;
                resetBtn.innerHTML = '<svg class="icon"><use href="#ic-arrow"/></svg> Reset Password';
            }
        });
    </script>
</body>
</html>
