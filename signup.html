<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#F5F0E8" />
    <title>Sign up · CleanCrew</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>

        :root {
            --cream: #F5F0E8;
            --ink: #14120F;
            --ink-soft: #3F3A34;
            --muted: #7A736A;
            --line: rgba(20, 18, 15, 0.08);
            --white: #FFFFFF;
            --blue: #1A6DDB;
            --blue-deep: #0F4FA8;
            --green: #0D9F6E;
            --red: #DC2626;
            --shadow: 0 24px 60px rgba(20, 18, 15, 0.08);
            --shadow-sm: 0 8px 28px rgba(20, 18, 15, 0.06);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { height: 100%; }
        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            color: var(--ink);
            background: var(--cream);
            min-height: 100%;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
        }
        a { color: var(--blue); text-decoration: none; font-weight: 600; }
        a:hover { text-decoration: underline; }

        .nav-shell {
            padding: 16px 20px 0;
        }
        .nav {
            width: min(480px, 100%);
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 12px 10px 16px;
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 999px;
            box-shadow: 0 8px 32px rgba(20, 18, 15, 0.06);
        }
        .nav-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 1.05rem;
            letter-spacing: -0.03em;
            color: var(--ink);
            text-decoration: none;
        }
        .nav-brand:hover { text-decoration: none; }
        .nav-brand img { width: 28px; height: 28px; object-fit: contain; }
        .nav-brand span span { color: var(--blue); }
        .nav-back {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--ink-soft);
            padding: 8px 14px;
            border-radius: 999px;
            text-decoration: none;
        }
        .nav-back:hover { background: rgba(20,18,15,0.05); text-decoration: none; color: var(--ink); }

        .main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 20px 48px;
        }
        .card {
            width: min(420px, 100%);
            background: rgba(255, 255, 255, 0.88);
            border: 1px solid var(--line);
            border-radius: 24px;
            padding: 36px 28px 28px;
            box-shadow: var(--shadow-sm);
            text-align: center;
        }
        .card-mascot {
            width: 64px;
            height: 64px;
            object-fit: contain;
            margin: 0 auto 14px;
            display: block;
            filter: drop-shadow(0 8px 16px rgba(26, 109, 219, 0.18));
        }
        .card h1 {
            font-size: 1.55rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            margin-bottom: 6px;
            color: var(--ink);
        }
        .card .sub {
            font-size: 0.95rem;
            color: var(--ink-soft);
            font-weight: 500;
            margin-bottom: 24px;
            line-height: 1.45;
        }
        .form-group {
            margin-bottom: 14px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--ink-soft);
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid var(--line);
            border-radius: 14px;
            font-size: 0.95rem;
            font-family: inherit;
            background: #fff;
            color: var(--ink);
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(26, 109, 219, 0.14);
        }
        .password-hint {
            font-size: 0.75rem;
            color: var(--muted);
            margin-top: 5px;
            font-weight: 500;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px 20px;
            border-radius: 999px;
            font-weight: 700;
            font-size: 0.95rem;
            font-family: inherit;
            border: none;
            cursor: pointer;
            transition: transform 0.15s, filter 0.15s, opacity 0.15s;
            margin-top: 6px;
        }
        .btn:hover:not(:disabled) { transform: translateY(-1px); }
        .btn:disabled { opacity: 0.65; cursor: not-allowed; }
        .btn-primary {
            background: var(--blue);
            color: #fff;
            box-shadow: 0 8px 24px rgba(26, 109, 219, 0.3);
        }
        .btn-primary:hover:not(:disabled) { filter: brightness(1.05); }
        .btn-sm { width: auto; padding: 10px 16px; font-size: 0.88rem; margin-top: 8px; }
        .btn-ghost {
            background: transparent;
            color: var(--ink-soft);
            border: 1px solid var(--line);
            margin-top: 10px;
        }
        .card-foot {
            margin-top: 20px;
            font-size: 0.9rem;
            color: var(--ink-soft);
            font-weight: 500;
        }
        .card-foot a { font-weight: 700; }
        .error-msg, .success-msg {
            display: none;
            padding: 11px 14px;
            border-radius: 12px;
            font-size: 0.88rem;
            font-weight: 600;
            margin-bottom: 14px;
            text-align: left;
            line-height: 1.4;
        }
        .error-msg.show, .success-msg.show { display: block; }
        .error-msg {
            background: #FEF2F2;
            color: #B91C1C;
            border: 1px solid #FECACA;
        }
        .success-msg {
            background: #ECFDF5;
            color: #047857;
            border: 1px solid #A7F3D0;
        }
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--ink);
            color: #fff;
            padding: 12px 18px;
            border-radius: 999px;
            font-size: 0.9rem;
            font-weight: 600;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 999;
            max-width: min(360px, calc(100% - 32px));
            text-align: center;
            box-shadow: var(--shadow);
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .toast.success { background: var(--green); }
        .toast.error { background: var(--red); }
        .icon { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; flex-shrink: 0; }
        .forgot-link {
            display: block;
            text-align: right;
            font-size: 0.82rem;
            margin: -6px 0 12px;
            font-weight: 600;
        }
        .community-note {
            margin-top: 16px;
            padding: 12px 14px;
            background: rgba(26, 109, 219, 0.06);
            border-radius: 14px;
            font-size: 0.82rem;
            color: var(--ink-soft);
            font-weight: 500;
            text-align: left;
            line-height: 1.45;
        }

    </style>
</head>
<body>

    <svg xmlns="http://www.w3.org/2000/svg" style="display:none">
        <symbol id="ic-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
        <symbol id="ic-check" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
        <symbol id="ic-sparkle" viewBox="0 0 24 24"><path d="M12 3l1.5 5.5L19 10l-5.5 1.5L12 17l-1.5-5.5L5 10l5.5-1.5L12 3z" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    </svg>

    <div class="nav-shell">
        <nav class="nav">
            <a href="index.html" class="nav-brand">
                <img src="mascot.png" alt="" width="28" height="28" />
                <span>Clean<span>Crew</span></span>
            </a>
            <a class="nav-back" href="index.html">← Home</a>
        </nav>
    </div>

    <div class="main">
        <div class="card">
            <img class="card-mascot" src="mascot.png" alt="" width="64" height="64" />
            <h1>Start free</h1>
            <div class="sub" id="statusMessage">25 free jobs. No card required. Set up in minutes.</div>
            <div class="error-msg" id="errorMsg"></div>
            <div class="success-msg" id="successMsg"></div>
            
            <form id="signupForm">
                <div class="form-group">
                    <label for="name">Full name</label>
                    <input type="text" id="name" placeholder="e.g. Amaka O." required autocomplete="name" />
                </div>
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" placeholder="you@email.com" required autocomplete="email" />
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Create a password" required minlength="6" autocomplete="new-password" />
                    <div class="password-hint">Minimum 6 characters</div>
                </div>
                <button type="submit" class="btn btn-primary" id="signupBtn">
                    <svg class="icon"><use href="#ic-arrow"/></svg> Create account
                </button>
            </form>

            
            <div class="community-note">
                Optional: join the CleanCrew owners community on WhatsApp after you sign up —
                <a href="https://chat.whatsapp.com/DZf3NbQL5DiCoajlQWmxQ6" target="_blank" rel="noopener">join here</a>.
            </div>

            <div class="card-foot">Already have an account? <a href="login.html">Log in</a></div>
        </div>
    </div>

    <div class="toast" id="toast">
        <span id="toastMessage">Success</span>
    </div>

<script>
        const SERVER_URL = 'https://cleancrew-backend.onrender.com';

        function showToast(msg, type) {
            type = type || '';
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            toastMessage.textContent = msg;
            toast.className = 'toast ' + type;
            toast.classList.add('show');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(function() {
                toast.classList.remove('show');
            }, 4000);
        }

        const token = localStorage.getItem('cleancrew_token');
        if (token) {
            window.location.href = 'dashboard.html';
        }

        const form = document.getElementById('signupForm');
        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');
        const signupBtn = document.getElementById('signupBtn');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            errorMsg.classList.remove('show');
            successMsg.classList.remove('show');
            signupBtn.disabled = true;
            signupBtn.innerHTML = '<svg class="icon"><use href="#ic-sparkle"/></svg> Creating account...';

            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            try {
                const response = await fetch(`${SERVER_URL}/api/auth/signup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // Stay on page — clear next-step instructions (do not dump users on landing)
                    var formEl = document.getElementById('signupForm');
                    if (formEl) formEl.style.display = 'none';
                    var linkEl = document.querySelector('.link');
                    if (linkEl) linkEl.style.display = 'none';
                    successMsg.innerHTML =
                        '<strong>Check your email</strong><br><br>' +
                        'We sent a confirmation link to <strong>' + email + '</strong>.<br><br>' +
                        'Open that email and click the link to activate your account. ' +
                        'Check spam/junk if you do not see it within a few minutes.<br><br>' +
                        '<button type="button" class="btn btn-primary btn-sm" id="resendConfirmBtn" style="margin-top:8px;">Resend confirmation email</button><br><br>' +
                        '<a href="login.html?email=' + encodeURIComponent(email) + '">Already confirmed? Go to login →</a>' +
                        '<p style="margin:16px 0 0;font-size:13px;opacity:0.9;line-height:1.45;">Optional: after you log in, you can join the <strong>CleanCrew owners WhatsApp Community</strong> from your dashboard — tips and other business owners. Never required to use the app.</p>';
                    successMsg.classList.add('show');
                    successMsg.style.display = 'block';
                    document.getElementById('resendConfirmBtn').onclick = async function() {
                        try {
                            var r = await fetch(SERVER_URL + '/api/auth/resend-confirmation', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ email: email })
                            });
                            var d = await r.json();
                            if (r.ok) {
                                successMsg.innerHTML = '<strong>Email resent</strong><br><br>Check <strong>' + email + '</strong> again (and spam). ' +
                                    '<br><br><a href="login.html?email=' + encodeURIComponent(email) + '">Go to login →</a>';
                            } else {
                                errorMsg.textContent = d.error || 'Could not resend email';
                                errorMsg.classList.add('show');
                            }
                        } catch (err) {
                            errorMsg.textContent = 'Could not connect to server';
                            errorMsg.classList.add('show');
                        }
                    };
                    signupBtn.disabled = true;
                    signupBtn.innerHTML = '<svg class="icon"><use href="#ic-check"/></svg> Account created';
                } else {
                    errorMsg.textContent = data.error || 'Signup failed. Please try again.';
                    errorMsg.classList.add('show');
                    signupBtn.disabled = false;
                    signupBtn.innerHTML = '<svg class="icon"><use href="#ic-arrow"/></svg> Create Account';
                }
            } catch (error) {
                errorMsg.textContent = 'Could not connect to server. Please try again.';
                errorMsg.classList.add('show');
                console.error('Fetch error:', error);
                signupBtn.disabled = false;
                signupBtn.innerHTML = '<svg class="icon"><use href="#ic-arrow"/></svg> Create Account';
            }
        });
    </script>
<script>
    (function () {
      if (!('serviceWorker' in navigator)) return;
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js').catch(function () {});
      });
    })();
    </script>
</body>
</html>
